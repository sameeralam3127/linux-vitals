# The demo fleet: three containers started by docker-compose.yml.
#
# Reports, snapshots, and .env all resolve from inventory_dir, so everything
# this demo writes lands in demo/reports/ -- next to this file, gitignored, and
# removable with `./run.sh clean`.

[linux_servers]
demo-ubuntu ansible_host=linux-vitals-demo-ubuntu
demo-rocky  ansible_host=linux-vitals-demo-rocky
demo-fedora ansible_host=linux-vitals-demo-fedora

[linux_servers:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
