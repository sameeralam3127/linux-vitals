---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    molecule_report_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/reports"
  tasks:
    - name: Read the generated JSON report
      ansible.builtin.slurp:
        src: "{{ molecule_report_dir }}/linux_vitals_report.json"
      delegate_to: localhost
      register: json_report_raw

    - name: Read the generated HTML dashboard
      ansible.builtin.slurp:
        src: "{{ molecule_report_dir }}/linux_vitals_report.html"
      delegate_to: localhost
      register: html_report_raw

    - name: Decode the reports
      ansible.builtin.set_fact:
        report: "{{ json_report_raw.content | b64decode | from_json }}"
        dashboard: "{{ html_report_raw.content | b64decode }}"

    - name: Select this host's entry from the report
      ansible.builtin.set_fact:
        host_report: >-
          {{
            report.hosts
            | selectattr('inventory_name', 'equalto', inventory_hostname)
            | list
            | first
          }}

    - name: Extract the finding ids for assertion
      # Findings are {id, message, severity} objects since #8. Assertions use
      # the id, which is the stable identity -- a reworded message must not be
      # able to turn an assertion into one that can never fire again.
      ansible.builtin.set_fact:
        finding_ids: "{{ host_report.findings | map(attribute='id') | list }}"

    # ------------------------------------------------------------------
    # CPU load, pressure stalls and swap (#34)
    # ------------------------------------------------------------------
    - name: Assert the load, pressure and swap probe read this host
      # The golden fixtures prove the parsing; this proves the script runs on
      # each distribution's own sh, awk and getconf against a real /proc. The
      # levels themselves depend on the CI runner, so only "measured" is
      # asserted: never Unknown, and PSI either read or reported unsupported.
      ansible.builtin.assert:
        that:
          - host_report.pressure.load_status in ['OK', 'Warning', 'Critical']
          - host_report.pressure.cpu_count | int >= 1
          - host_report.pressure.load_per_cpu['5m'] is number
          - host_report.pressure.psi_status in ['OK', 'Warning', 'Critical', 'Unsupported']
          - (host_report.pressure.psi_status == 'Unsupported') == (host_report.pressure.psi is none)
          - host_report.pressure.swap_status in ['OK', 'Warning', 'Critical']
          - host_report.pressure.swap_rate_per_sec is number
          - >-
            host_report.findings
            | selectattr('id', 'in', ['cpu_load_high', 'pressure_stall_high', 'swap_paging_high'])
            | selectattr('status', 'equalto', 'unknown') | list | length == 0
        fail_msg: "The saturation probe did not produce a full reading: {{ host_report.pressure }}"

    # ------------------------------------------------------------------
    # Filesystem capacity/inode checks (#30)
    # ------------------------------------------------------------------
    - name: Assert the filesystem probe-free check produced a full reading
      # Percentages depend on the CI runner's actual disk, so only the shape
      # is asserted here: a non-empty mount list, a worst_status rollup that
      # is one of the known values, and every mount that made it into the
      # list carries a real status, never left as a placeholder. This does
      # not require / or /boot by name: some container images this role is
      # also expected to scan (and that Molecule itself runs its scenarios
      # in) do not report a distinct ansible_facts.mounts entry for an
      # overlay root at all, which is a fact-gathering gap outside this
      # role's control, not a reason to leave the mount unreported if one
      # exists. The /-is-always-in-scope rule (filesystems.yml) and the
      # golden fixture (filesystem_findings) are what prove a present /
      # with fstype overlay stays in scope.
      ansible.builtin.assert:
        that:
          - host_report.filesystems.worst_status in ['OK', 'Warning', 'Critical', 'Unknown']
          - host_report.filesystems.mounts | length > 0
          - host_report.filesystems.mounts | rejectattr('status', 'in', ['OK', 'Warning', 'Critical', 'Unknown']) | list | length == 0
        fail_msg: "The filesystem check did not produce a full reading: {{ host_report.filesystems }}"

    # ------------------------------------------------------------------
    # Finding severity (#8)
    # ------------------------------------------------------------------
    - name: Assert every finding carries an id, a message, and a known severity
      ansible.builtin.assert:
        that:
          - host_report.findings | selectattr('id', 'undefined') | list | length == 0
          - host_report.findings | selectattr('message', 'undefined') | list | length == 0
          - >-
            host_report.findings
            | rejectattr('severity', 'in', ['info', 'warning', 'critical'])
            | list | length == 0
        fail_msg: "Malformed findings: {{ host_report.findings }}"

    - name: Assert the host severity rollup matches the findings it was built from
      # Guards the ordering trap: as strings "critical" < "info" < "warning",
      # so an alphabetical max would report a host carrying a critical finding
      # as "warning".
      ansible.builtin.assert:
        that:
          - >-
            host_report.severity == (
              'critical' if 'critical' in severities
              else 'warning' if 'warning' in severities
              else 'info' if 'info' in severities
              else 'none'
            )
          - host_report.severity_counts.critical | int == severities | select('equalto', 'critical') | list | length
          - host_report.severity_counts.warning | int == severities | select('equalto', 'warning') | list | length
          - host_report.severity_counts.info | int == severities | select('equalto', 'info') | list | length
        fail_msg: >-
          Severity rollup {{ host_report.severity }} / {{ host_report.severity_counts }}
          disagrees with {{ severities }}
      vars:
        severities: "{{ host_report.findings | map(attribute='severity') | list }}"

    - name: Assert the fleet severity rollup is present and partitions the fleet
      ansible.builtin.assert:
        that:
          - report.summary.hosts_by_severity is defined
          - report.summary.findings_by_severity is defined
          - >-
            report.summary.hosts_by_severity.values() | map('int') | sum
            == report.summary.servers_checked | int
        fail_msg: "Fleet severity rollup: {{ report.summary.hosts_by_severity }}"

    # ------------------------------------------------------------------
    # Discovery
    # ------------------------------------------------------------------
    - name: Assert discovery identified the platform correctly
      ansible.builtin.assert:
        that:
          - report.schema_version == '2.3'
          - host_report.os.family == vitals_expected_os_family
          - host_report.os.package_manager == vitals_expected_package_manager
          - host_report.os.log_source == 'journald'
          - host_report.platform.uptime | length > 0
        fail_msg: >-
          Expected {{ vitals_expected_os_family }}/{{ vitals_expected_package_manager }},
          got {{ host_report.os }}

    - name: Assert discovery collected memory, kernel and service state
      ansible.builtin.assert:
        that:
          - host_report.memory.total_mb | float > 0
          - host_report.memory.status in ['OK', 'Warning', 'Critical']
          - host_report.kernel.running | length > 0
          - host_report.boot_space.status in ['Healthy', 'Low', 'Not Available']
          - host_report.security.selinux_status | length > 0

    # ------------------------------------------------------------------
    # Security posture: firewall, SSH hardening, kernel taint, and
    # reboot-blocking deleted libraries (#36)
    # ------------------------------------------------------------------
    - name: Assert the firewall probe answered on this container
      # "No firewall tool found" is itself a confident answer (source=none),
      # so supported is always true here; only a genuine probe error would
      # make it false, which none of these images should hit.
      ansible.builtin.assert:
        that:
          - host_report.security.firewall.detection_supported in [true, false]
          - host_report.security.firewall.active in [true, false]
          - host_report.security.firewall.source | length > 0
        fail_msg: "Firewall probe: {{ host_report.security.firewall }}"

    - name: Assert the SSH hardening probe reported a consistent shape
      # These containers are driven over the Docker connection, not SSH, so
      # sshd and root escalation are not guaranteed to be present -- this
      # asserts "answered" and "did not answer" are told apart, not a
      # specific value. detection_supported false must still carry values
      # that read as absent (empty strings), never guessed at.
      ansible.builtin.assert:
        that:
          - host_report.security.ssh_hardening.detection_supported in [true, false]
          - >-
            host_report.security.ssh_hardening.detection_supported
            or (
              host_report.security.ssh_hardening.permit_root_login == ''
              and host_report.security.ssh_hardening.password_authentication == ''
              and host_report.security.ssh_hardening.permit_empty_passwords == ''
            )
          - >-
            host_report.findings
            | selectattr('id', 'in', [
                'ssh_permit_root_login_insecure',
                'ssh_password_authentication_enabled',
                'ssh_permit_empty_passwords_enabled',
              ])
            | selectattr('status', 'equalto', 'unknown')
            | map(attribute='reason') | select('equalto', '') | list | length == 0
        fail_msg: "SSH hardening probe: {{ host_report.security.ssh_hardening }}"

    - name: Assert the kernel taint probe read the always-available file
      # /proc/sys/kernel/tainted is a plain file read with no privilege or
      # distro-specific tool involved, so this is the one check in this
      # group expected to succeed on every container, every family.
      ansible.builtin.assert:
        that:
          - host_report.security.kernel_taint.supported == true
          - host_report.security.kernel_taint.value | int >= 0
          - host_report.security.kernel_taint.reasons is sequence
        fail_msg: "Kernel taint probe: {{ host_report.security.kernel_taint }}"

    - name: Assert the deleted-library probe told absence from a real answer
      # lsof may or may not be preinstalled in a given image; either way the
      # shape must distinguish "not installed" from "checked, found none".
      ansible.builtin.assert:
        that:
          - host_report.security.reboot_blocking_processes.supported in [true, false]
          - host_report.security.reboot_blocking_processes.processes is sequence
          - >-
            host_report.security.reboot_blocking_processes.supported
            or (
              host_report.findings
              | selectattr('id', 'equalto', 'reboot_blocking_deleted_libs')
              | selectattr('status', 'equalto', 'unknown')
              | list | length == 1
            )
        fail_msg: "Deleted-library probe: {{ host_report.security.reboot_blocking_processes }}"

    - name: Assert the time synchronization service was resolved
      # Asserted on finding id rather than message text: the id is the stable
      # identity (see issue #8), so rewording a finding no longer silently
      # turns this assertion into one that can never fire.
      ansible.builtin.assert:
        that:
          - "'time_sync_absent' not in finding_ids"
        fail_msg: >-
          The installed time-sync unit was not resolved:
          {{ host_report.findings }}

    - name: Assert the time synchronization service is reported as active
      ansible.builtin.assert:
        that:
          - "'time_sync_inactive' not in finding_ids"
        fail_msg: "Time sync findings fired unexpectedly: {{ host_report.findings }}"
      when: vitals_expect_time_sync_active | bool

    # ------------------------------------------------------------------
    # Reboot detection (per-distro, see docs/kernel-reboot-detection.md)
    # ------------------------------------------------------------------
    - name: Assert reboot detection used a source this distro can provide
      ansible.builtin.assert:
        that:
          - host_report.reboot.source in vitals_expected_reboot_sources
          - host_report.reboot.required in [true, false]
          - host_report.reboot.reason | length > 0
        fail_msg: >-
          Reboot source {{ host_report.reboot.source }} is not one of
          {{ vitals_expected_reboot_sources }}

    # ------------------------------------------------------------------
    # Self-healing
    # ------------------------------------------------------------------
    - name: Assert the healable service was restarted and reported as fixed
      ansible.builtin.assert:
        that:
          - "'molecule-flaky.service' in host_report.self_healing.services_healed"
          - healed_flaky.result == 'Fixed'
          - report.summary.auto_fixed_count | int >= 1
        fail_msg: "Self-healing outcomes: {{ host_report.self_healing }}"
      vars:
        healed_flaky: >-
          {{
            host_report.self_healing.healing_results
            | selectattr('service', 'equalto', 'molecule-flaky.service')
            | list
            | first
          }}

    - name: Assert the unfixable service was reported for manual follow-up
      ansible.builtin.assert:
        that:
          - broken_result.result != 'Fixed'
          - "'service_manual_followup' in finding_ids"
          - >-
            'molecule-broken.service' in (
              host_report.findings
              | selectattr('id', 'equalto', 'service_manual_followup')
              | map(attribute='subject') | list
            )
        fail_msg: "Self-healing outcomes: {{ host_report.self_healing }}"
      vars:
        broken_result: >-
          {{
            host_report.self_healing.healing_results
            | selectattr('service', 'equalto', 'molecule-broken.service')
            | list
            | first
          }}

    - name: Assert the healed unit is actually running on the host
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - molecule-flaky.service
      register: flaky_state
      changed_when: false
      failed_when: flaky_state.stdout | trim != 'active'

    - name: Assert the planted broken unit appears in the failed-unit inventory
      # #32: every failed unit is reported, not just the three this
      # collection names by default. molecule-broken.service is enabled and
      # never recovers (prepare.yml), so it is in this list throughout the
      # run, heal attempt included.
      ansible.builtin.assert:
        that:
          - "'molecule-broken.service' in (host_report.failed_units.units | map(attribute='name') | list)"
          - host_report.failed_units.count | int >= 1
        fail_msg: "Failed units: {{ host_report.failed_units }}"

    - name: Assert the unfixable unit is still failed on the host
      ansible.builtin.command:
        argv:
          - systemctl
          - is-failed
          - molecule-broken.service
      register: broken_state
      changed_when: false
      failed_when: broken_state.stdout | trim != 'failed'

    - name: Assert the excluded unit was reported as skipped, not attempted
      # #148: the guardrail's whole point is that a failed, enabled unit an
      # operator has ruled out is left alone -- and that the report says so
      # rather than leaving a gap where its outcome would be.
      ansible.builtin.assert:
        that:
          - skipped_excluded | length == 1
          - skipped_excluded | first == expected_skip
          - >-
            'molecule-excluded.service' not in (
              host_report.self_healing.healing_results
              | map(attribute='service') | list
            )
          - "'molecule-excluded.service' not in host_report.self_healing.services_healed"
        fail_msg: "Self-healing outcomes: {{ host_report.self_healing }}"
      vars:
        skipped_excluded: >-
          {{
            host_report.self_healing.skipped_by_policy | default([])
            | selectattr('service', 'equalto', 'molecule-excluded.service')
            | list
          }}
        expected_skip:
          service: molecule-excluded.service
          reason: excluded
          detail: it matches linux_vitals_heal_exclude_services

    - name: Assert the excluded unit is still failed on the host
      # It shares the flaky unit's script and the failure marker is gone
      # (prepare.yml), so a restart would have fixed it. Still failed means
      # no restart was attempted.
      ansible.builtin.command:
        argv:
          - systemctl
          - is-failed
          - molecule-excluded.service
      register: excluded_state
      changed_when: false
      failed_when: excluded_state.stdout | trim != 'failed'

    - name: Assert the units policy did allow were still restarted
      # The guardrails must not quietly narrow a run that did not ask them to.
      # molecule-flaky matches the default include list and no exclusion, so
      # it is in scope and must not appear among the skipped.
      ansible.builtin.assert:
        that:
          - >-
            host_report.self_healing.skipped_by_policy | default([])
            | map(attribute='service') | list == ['molecule-excluded.service']
        fail_msg: >-
          Units skipped by policy:
          {{ host_report.self_healing.skipped_by_policy | default([]) }}

    - name: Check self-healing verification (#24)
      ansible.builtin.include_tasks:
        file: tasks/heal_settle_verify.yml

    - name: Check the Type=oneshot self-healing outcome (#152)
      ansible.builtin.include_tasks:
        file: tasks/heal_oneshot_verify.yml

    # ------------------------------------------------------------------
    # Reporting
    # ------------------------------------------------------------------
    - name: Assert the JSON report summarises the run
      ansible.builtin.assert:
        that:
          - report.summary.servers_checked | int == 1
          - report.summary.overall_status in ['PASS', 'FAIL']
          - report.maintenance.phase == 'adhoc'
          - host_report.status in ['Pass', 'Fail']
          - host_report.hostname | length > 0

    - name: Assert the HTML dashboard rendered this host
      ansible.builtin.assert:
        that:
          - "'LinuxVitals Molecule Dashboard' in dashboard"
          - inventory_hostname in dashboard
          - "'molecule-flaky.service' in dashboard"
          - "'molecule-broken.service' in dashboard"

    - name: Assert the run was archived
      # Snapshots are only written for the baseline/postcheck phases, so an
      # adhoc converge should leave a timestamped HTML archive and nothing else.
      ansible.builtin.find:
        paths: "{{ molecule_report_dir }}/archive"
        patterns: "linux_vitals_report-*.html"
      delegate_to: localhost
      register: archived_reports
      failed_when: archived_reports.matched < 1

    - name: Check journals as the unprivileged Docker user
      vars:
        ansible_user: vitals-journal-reader
        ansible_pipelining: true
      block:
        - name: Confirm the scan connection is unprivileged
          ansible.builtin.command:
            argv:
              - id
              - -un
          register: journal_reader_identity
          changed_when: false
          failed_when: journal_reader_identity.stdout | trim != 'vitals-journal-reader'

        - name: Scan as an unprivileged user without journal access
          ansible.builtin.include_role:
            name: sameeralam3127.linux_vitals.vitals_scan

        - name: Assert inaccessible journals are unknown rather than clean
          ansible.builtin.assert:
            that:
              - journal_findings | length == 2
              - journal_findings | rejectattr('status', 'equalto', 'unknown') | list | length == 0
              - journal_findings | map(attribute='reason') | select('equalto', '') | list | length == 0
              - linux_vitals_result.unknown_count | int >= 2
            fail_msg: "Unprivileged journal findings: {{ journal_findings }}"
          vars:
            journal_findings: >-
              {{ linux_vitals_result.findings
                 | selectattr('id', 'in', ['log_errors', 'kernel_install_failures']) | list }}

        - name: Assert an unreadable btmp is unknown rather than a clean host
          # btmp is 0600 or 0660 root:utmp on every supported family, or absent
          # on a minimal image. Unprivileged, the check can never run, so it
          # must say so with a reason -- never "No failed login attempts found"
          # (#39). Which of the three reasons applies varies by image.
          ansible.builtin.assert:
            that:
              - login_findings | length == 1
              - login_findings[0].status == 'unknown'
              - login_findings[0].reason | length > 0
              - "linux_vitals_result.last_failed_login is match('Not checked: ')"
            fail_msg: "Unprivileged failed-login result: {{ login_findings }} / {{ linux_vitals_result.last_failed_login }}"
          vars:
            login_findings: >-
              {{ linux_vitals_result.findings | selectattr('id', 'equalto', 'failed_logins') | list }}

    # ------------------------------------------------------------------
    # The scan does not count its own invocation lines (#133). Before the
    # journal flood below, which would swamp the counts it compares.
    # ------------------------------------------------------------------
    - name: Check that the scan excludes its own journal footprint
      ansible.builtin.include_tasks: tasks/journal_self_exclusion.yml

    # ------------------------------------------------------------------
    # Bounded journal scans (#23). Last, because it floods the journal.
    # ------------------------------------------------------------------
    - name: Check that a flooded journal still yields a bounded scan result
      ansible.builtin.include_tasks: tasks/journal_bound.yml
      vars:
        vitals_flood_lines: 5000
        vitals_flood_cap: 200
