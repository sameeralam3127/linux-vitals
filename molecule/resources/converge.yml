---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    molecule_report_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/reports"
    # Self-healing is off by default; the whole point of this scenario is to
    # prove the heal path, so it is opted into here.
    linux_vitals_heal_enabled: true
    # One of the three planted failed units is off limits (#148). It is
    # healable -- it shares the flaky unit's script -- so verify.yml proving
    # it is still failed proves the exclusion held and no restart was tried.
    # The include list and the window are left at their defaults so the rest
    # of the heal path is exercised exactly as it was before the guardrails.
    linux_vitals_heal_exclude_services:
      - molecule-excluded
    # The report role writes to inventory_dir by default, which is Molecule's
    # generated inventory directory -- pin every output under the scenario's
    # ephemeral directory instead so verify.yml knows where to look.
    linux_vitals_output_path: "{{ molecule_report_dir }}/linux_vitals_report.html"
    linux_vitals_json_output_path: "{{ molecule_report_dir }}/linux_vitals_report.json"
    linux_vitals_report_archive_dir: "{{ molecule_report_dir }}/archive"
    linux_vitals_snapshot_dir: "{{ molecule_report_dir }}/snapshots"
    linux_vitals_report_title: "LinuxVitals Molecule Dashboard"
  roles:
    - role: sameeralam3127.linux_vitals.vitals_scan
    - role: sameeralam3127.linux_vitals.vitals_heal
    - role: sameeralam3127.linux_vitals.vitals_report

- name: Converge the bounded restart wait (#151)
  # A second play, after the report above has been written, so a unit whose
  # start job never completes cannot slow the run the #24 scenario times. The
  # include list puts nothing but the hung unit in scope, and the budgets are
  # cut down so a bound that used to be missing entirely can be proven in
  # seconds rather than in the two minutes the defaults allow.
  hosts: all
  gather_facts: true
  vars:
    linux_vitals_heal_enabled: true
    linux_vitals_heal_include_services:
      - molecule-hang
    # Long enough that the bound is what fires rather than a slow runner
    # transferring and starting the module, short enough to prove in seconds.
    linux_vitals_heal_restart_timeout: 15
    linux_vitals_heal_settle_retries: 2
    linux_vitals_heal_settle_delay: 1
  tasks:
    - name: Plant and heal a unit whose start job never completes
      ansible.builtin.include_tasks:
        file: tasks/heal_timeout_converge.yml
      vars:
        heal_timeout_marker: /run/molecule-hang-fail
