namespace: sameeralam3127
name: linux_vitals
version: 2.2.0
readme: README.md
authors:
  - Sameer Alam <sameeralam3127@gmail.com>

description: >-
  Prove a patch window broke nothing: check every Linux host (RHEL, Fedora,
  Ubuntu, Debian, SUSE) before and after maintenance, and get a per-host
  before/after report for the change ticket and an exit code a pipeline can
  gate on. Agentless and read-only; also runs one-off fleet health checks.

license:
  - MIT

tags:
  - linux
  - monitoring
  - healthcheck
  - maintenance
  - reporting
  - dashboard
  - infrastructure
  - sysadmin
  - selfhealing
  - patching
  - changemanagement

repository: https://github.com/sameeralam3127/linux-vitals
documentation: https://github.com/sameeralam3127/linux-vitals/tree/main/docs
homepage: https://sameeralam3127.github.io/linux-vitals/
issues: https://github.com/sameeralam3127/linux-vitals/issues

build_ignore:
  - "*.tar.gz"
  - .github
  - .gitignore
  - .ansible-lint
  - .pre-commit-config.yaml
  - .env
  - .env.example
  - .facts
  - .ansible
  - venv
  - .dev-collections
  - collections
  - "*.retry"
  - reports
  - inventory
  - ansible.cfg
  - requirements-dev.txt
  - requirements.yml
  - pytest.ini
  - tests
  - molecule
  - demo
  - CLAUDE.md
  - .pytest_cache
  - .DS_Store

dependencies:
  community.general: ">=9.0.0"
