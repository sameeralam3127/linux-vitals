---
- name: Load controller-side configuration
  ansible.builtin.include_tasks:
    file: config.yml
    apply:
      tags:
        - always
        - config
  tags:
    - always
    - config

- name: Persist a snapshot of this run for baseline/postcheck comparison
  ansible.builtin.include_tasks:
    file: snapshot.yml
    apply:
      tags:
        - reporting
  tags:
    - reporting

- name: Compare this run against a prior baseline snapshot
  ansible.builtin.include_tasks:
    file: compare.yml
    apply:
      tags:
        - reporting
  tags:
    - reporting

- name: Build reports
  ansible.builtin.include_tasks:
    file: render.yml
    apply:
      tags:
        - reporting
  tags:
    - reporting

- name: Send notifications
  ansible.builtin.include_tasks:
    file: notify.yml
    apply:
      tags:
        - reporting
  tags:
    - reporting
    - notifications

# After the notifications and before the gate: a failed page fails the run, and
# the gate must not be what hides that.
- name: Page for hosts with a finding worth waking someone for
  ansible.builtin.include_tasks:
    file: paging.yml
    apply:
      tags:
        - reporting
        - notifications
  when: linux_vitals_pagerduty_enabled | bool or linux_vitals_opsgenie_enabled | bool
  tags:
    - reporting
    - notifications

# Keep this last: the gate must never suppress reports, archives, or notifications.
- name: Apply optional fleet health pipeline gate
  ansible.builtin.include_tasks:
    file: gate.yml
    apply:
      tags:
        - reporting
  tags:
    - reporting
