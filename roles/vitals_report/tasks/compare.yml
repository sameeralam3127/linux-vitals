---
- name: Determine baseline snapshot path for comparison
  ansible.builtin.set_fact:
    linux_vitals_baseline_snapshot_path: >-
      {{ linux_vitals_snapshot_dir }}/{{ linux_vitals_maintenance_id }}/baseline/{{ inventory_hostname }}.json
  when: linux_vitals_phase == 'postcheck'
  tags:
    - reporting

- name: Check whether a baseline snapshot exists for this host
  ansible.builtin.stat:
    path: "{{ linux_vitals_baseline_snapshot_path }}"
  register: linux_vitals_baseline_snapshot_file
  delegate_to: localhost
  when: linux_vitals_phase == 'postcheck'
  tags:
    - reporting

- name: Load baseline snapshot when available
  ansible.builtin.set_fact:
    linux_vitals_baseline_result: >-
      {{ lookup('ansible.builtin.file', linux_vitals_baseline_snapshot_path) | from_json }}
  when:
    - linux_vitals_phase == 'postcheck'
    - linux_vitals_baseline_snapshot_file.stat.exists | default(false)
  tags:
    - reporting

# Snapshots written by 1.x hold plain-string findings. Each is translated to
# the object it would be today, using the fixed set of messages 1.3.1 could
# emit, so a finding that persists through a window spanning the upgrade
# matches its 2.x counterpart instead of being reported as both resolved and
# new. A string that matches nothing keeps the message as its id -- the only
# identity it has. Severity follows the documented precedence minus the
# per-finding step, which a string never had.
- name: Normalise baseline findings written by an earlier release
  ansible.builtin.set_fact:
    linux_vitals_baseline_findings: >-
      {%- set severities = linux_vitals_finding_severities | default({})
            | combine(linux_vitals_finding_severity_overrides | default({})) -%}
      {%- set out = [] -%}
      {%- for finding in linux_vitals_baseline_result.findings | default([]) -%}
      {%- if finding is mapping -%}
      {%- set _ = out.append(finding) -%}
      {%- elif finding is match('.+ requires manual follow-up$') -%}
      {%- set _ = out.append({
            'id': 'service_manual_followup',
            'message': finding,
            'severity': severities['service_manual_followup'] | default('warning'),
            'subject': finding | regex_replace(' requires manual follow-up$', '')
          }) -%}
      {%- else -%}
      {%- set finding_id = linux_vitals_legacy_finding_ids[finding] | default(finding) -%}
      {%- set _ = out.append({
            'id': finding_id,
            'message': finding,
            'severity': severities[finding_id] | default('warning')
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  vars:
    linux_vitals_legacy_finding_ids:
      "RAM usage is critical": ram_critical
      "Recent logs contain error or failed entries": log_errors
      "sssd is not active": sssd_inactive
      "systemd-journald is not active": journald_inactive
      "chronyd or ntp is not installed": time_sync_absent
      "Time synchronization service is not active": time_sync_inactive
      "System reboot is required": reboot_required
      "Latest installed kernel is not currently running": kernel_not_latest
      "Default boot entry does not select the latest installed kernel": bootloader_mismatch
      "Boot partition free space is low": boot_space_low
      "Kernel installation or bootloader related failures found in logs": kernel_install_failures
      "Recent failed login attempts detected": failed_logins
      "SELinux is disabled or unavailable": selinux_disabled
      "AppArmor is disabled or unavailable": apparmor_disabled
  when:
    - linux_vitals_phase == 'postcheck'
    - linux_vitals_baseline_snapshot_file.stat.exists | default(false)
  tags:
    - reporting

- name: Build before/after comparison for this host
  ansible.builtin.set_fact:
    linux_vitals_comparison:
      baseline_available: true
      status_before: "{{ linux_vitals_baseline_result.final_status }}"
      status_after: "{{ linux_vitals_result.final_status }}"
      status_changed: "{{ linux_vitals_baseline_result.final_status != linux_vitals_result.final_status }}"
      status_improved: >-
        {{
          linux_vitals_baseline_result.final_status == 'Fail'
          and linux_vitals_result.final_status == 'Pass'
        }}
      status_regressed: >-
        {{
          linux_vitals_baseline_result.final_status == 'Pass'
          and linux_vitals_result.final_status == 'Fail'
        }}
      ram_used_pct_before: "{{ linux_vitals_baseline_result.ram_used_pct }}"
      ram_used_pct_after: "{{ linux_vitals_result.ram_used_pct }}"
      ram_used_pct_delta: >-
        {{
          (
            (linux_vitals_result.ram_used_pct | float)
            - (linux_vitals_baseline_result.ram_used_pct | float)
          ) | round(1)
        }}
      running_kernel_before: "{{ linux_vitals_baseline_result.running_kernel }}"
      running_kernel_after: "{{ linux_vitals_result.running_kernel }}"
      kernel_changed: >-
        {{ linux_vitals_baseline_result.running_kernel != linux_vitals_result.running_kernel }}
      reboot_required_before: "{{ linux_vitals_baseline_result.reboot_required }}"
      reboot_required_after: "{{ linux_vitals_result.reboot_required }}"
      # Diffed on identity -- (id, subject) -- not on the whole finding
      # object. Two runs of the same finding can differ in `message` or in
      # `severity` (an operator retuned it between runs), and a whole-object
      # difference() would then report one finding as both new and resolved.
      # The object carried through is the current run's, so the dashboard
      # shows current wording and current severity.
      #
      # `subject` is part of the identity because an id is not unique within a
      # host: every service self-healing could not fix is
      # service_manual_followup, and every certificate finding repeats per
      # certificate. Diffing on id alone would hide a service that newly
      # failed while another was already failing (#77).
      new_findings: >-
        {%- set base_keys = [] -%}
        {%- for finding in linux_vitals_baseline_findings -%}
        {%- set _ = base_keys.append(finding.id ~ '|' ~ finding.subject | default('', true)) -%}
        {%- endfor -%}
        {%- set out = [] -%}
        {%- for finding in linux_vitals_result.findings | default([]) -%}
        {%- if (finding.id ~ '|' ~ finding.subject | default('', true)) not in base_keys -%}
        {%- set _ = out.append(finding) -%}
        {%- endif -%}
        {%- endfor -%}
        {{ out }}
      resolved_findings: >-
        {%- set now_keys = [] -%}
        {%- for finding in linux_vitals_result.findings | default([]) -%}
        {%- set _ = now_keys.append(finding.id ~ '|' ~ finding.subject | default('', true)) -%}
        {%- endfor -%}
        {%- set out = [] -%}
        {%- for finding in linux_vitals_baseline_findings -%}
        {%- if (finding.id ~ '|' ~ finding.subject | default('', true)) not in now_keys -%}
        {%- set _ = out.append(finding) -%}
        {%- endif -%}
        {%- endfor -%}
        {{ out }}
      severity_before: "{{ linux_vitals_baseline_result.severity | default('unknown') }}"
      severity_after: "{{ linux_vitals_result.severity | default('unknown') }}"
  when:
    - linux_vitals_phase == 'postcheck'
    - linux_vitals_baseline_snapshot_file.stat.exists | default(false)
  tags:
    - reporting

- name: Default comparison facts when no baseline snapshot is available
  ansible.builtin.set_fact:
    linux_vitals_comparison:
      baseline_available: false
  when:
    - linux_vitals_phase == 'postcheck'
    - not (linux_vitals_baseline_snapshot_file.stat.exists | default(false))
  tags:
    - reporting

- name: Merge the comparison into this host's result
  ansible.builtin.set_fact:
    linux_vitals_result: "{{ linux_vitals_result | combine({'comparison': linux_vitals_comparison}) }}"
  when: linux_vitals_phase == 'postcheck'
  tags:
    - reporting
