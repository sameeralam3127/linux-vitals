---
- name: Render reusable notification summary message
  ansible.builtin.set_fact:
    linux_vitals_notification_message: "{{ lookup('ansible.builtin.template', 'slack_message.txt.j2') }}"
  delegate_to: localhost
  run_once: true
  tags:
    - reporting
    - notifications

# Rendered in its own task rather than inline in the uri body below, because
# that task is no_log: a template error there would be reported as a masked
# task failure with no indication of which line of the template failed. This
# payload carries the same hostnames and findings the plain-text message
# already carries, and no credential, so it does not need masking itself.
#
# The lookup's return type depends on the core: ansible-core 2.16 converts
# output that looks like a data literal into a dict, newer cores return a
# string. `from_json` on the dict raises, so parse only a string (#85).
- name: Render the Slack Block Kit payload
  ansible.builtin.set_fact:
    linux_vitals_slack_payload: >-
      {%- set payload = lookup('ansible.builtin.template', 'slack_message.json.j2') -%}
      {{ payload if payload is mapping else payload | from_json }}
  delegate_to: localhost
  run_once: true
  when: linux_vitals_effective_slack_webhook_url | length > 0
  tags:
    - reporting
    - notifications

# Every send below is no_log because its arguments are credentials: an incoming
# webhook URL *is* the bearer token for that channel, linux_vitals_generic_
# webhook_headers is the documented place to put an Authorization header, and
# the SMTP username sits next to a password the module already masks. Ansible
# prints a failing task's arguments, so without this a single failed post
# publishes the secret to CI logs, scrollback, and any callback plugin.
#
# Each send therefore records its outcome instead of failing, and the task after
# it reports the failure quoting only the channel and the status code. The
# module's own msg is never echoed: for some failure modes it embeds the URL.

- name: Send Slack maintenance summary
  ansible.builtin.uri:
    url: "{{ linux_vitals_effective_slack_webhook_url }}"
    method: POST
    body_format: json
    body: "{{ linux_vitals_slack_payload }}"
    status_code: 200
  register: linux_vitals_slack_delivery
  no_log: true
  failed_when: false
  delegate_to: localhost
  run_once: true
  when: linux_vitals_effective_slack_webhook_url | length > 0
  tags:
    - reporting
    - notifications

- name: Fail when the Slack notification did not arrive
  ansible.builtin.fail:
    msg: >-
      Slack notification failed: HTTP status
      {{ linux_vitals_slack_delivery.status | default(-1) }}
      ({{ 'the endpoint could not be reached' if
      (linux_vitals_slack_delivery.status | default(-1) | int) == -1
      else 'the endpoint rejected the request' }}).
      The webhook URL is withheld from this message because it is a credential.
  when:
    - linux_vitals_slack_delivery is defined
    - not (linux_vitals_slack_delivery.skipped | default(false))
    - (linux_vitals_slack_delivery.status | default(-1) | int) != 200
  delegate_to: localhost
  run_once: true
  tags:
    - reporting
    - notifications

- name: Send email maintenance summary
  community.general.mail:
    host: "{{ linux_vitals_effective_email_host }}"
    port: "{{ linux_vitals_email_port | int }}"
    secure: "{{ linux_vitals_email_secure }}"
    username: "{{ linux_vitals_effective_email_username | default(omit, true) }}"
    password: "{{ linux_vitals_effective_email_password | default(omit, true) }}"
    to: "{{ linux_vitals_email_to }}"
    cc: "{{ linux_vitals_email_cc if linux_vitals_email_cc | length > 0 else omit }}"
    from: "{{ linux_vitals_email_from }}"
    subject: "{{ linux_vitals_email_subject }}"
    body: "{{ linux_vitals_notification_message }}"
  register: linux_vitals_email_delivery
  no_log: true
  failed_when: false
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_email_enabled
    - linux_vitals_email_to | length > 0
  tags:
    - reporting
    - notifications

- name: Fail when the email notification did not send
  # The mail module reports success by changing; on any failure it does not.
  ansible.builtin.fail:
    msg: >-
      Email notification failed while talking to
      {{ linux_vitals_effective_email_host }}:{{ linux_vitals_email_port }}.
      SMTP credentials are withheld from this message.
  when:
    - linux_vitals_email_delivery is defined
    - not (linux_vitals_email_delivery.skipped | default(false))
    - not (linux_vitals_email_delivery.changed | default(false))
  delegate_to: localhost
  run_once: true
  tags:
    - reporting
    - notifications

# Rendered outside the no_log send for the same two reasons as the Slack
# payload. Until #85 this was inline in the send below, and on 2.16 the
# from_json type error surfaced only as a "censored" failure: the webhook
# never sent on the declared floor, and nothing said why. The URL and headers
# -- the credentials -- stay in the no_log task.
- name: Render the generic webhook payload
  ansible.builtin.set_fact:
    linux_vitals_generic_webhook_payload: >-
      {%- set payload = lookup('ansible.builtin.template', 'generic_webhook_payload.json.j2') -%}
      {{ payload if payload is mapping else payload | from_json }}
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_generic_webhook_enabled
    - linux_vitals_effective_generic_webhook_url | length > 0
  tags:
    - reporting
    - notifications

- name: Send generic webhook maintenance summary
  ansible.builtin.uri:
    url: "{{ linux_vitals_effective_generic_webhook_url }}"
    method: POST
    body_format: json
    body: "{{ linux_vitals_generic_webhook_payload }}"
    headers: "{{ linux_vitals_generic_webhook_headers if linux_vitals_generic_webhook_headers | length > 0 else omit }}"
    status_code: "{{ linux_vitals_generic_webhook_status_code | int }}"
  register: linux_vitals_generic_webhook_delivery
  no_log: true
  failed_when: false
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_generic_webhook_enabled
    - linux_vitals_effective_generic_webhook_url | length > 0
  tags:
    - reporting
    - notifications

- name: Fail when the generic webhook notification did not arrive
  ansible.builtin.fail:
    msg: >-
      Generic webhook notification failed: HTTP status
      {{ linux_vitals_generic_webhook_delivery.status | default(-1) }}, expected
      {{ linux_vitals_generic_webhook_status_code | int }}.
      The webhook URL and request headers are withheld from this message
      because they are credentials.
  when:
    - linux_vitals_generic_webhook_delivery is defined
    - not (linux_vitals_generic_webhook_delivery.skipped | default(false))
    - >-
      (linux_vitals_generic_webhook_delivery.status | default(-1) | int)
      != (linux_vitals_generic_webhook_status_code | int)
  delegate_to: localhost
  run_once: true
  tags:
    - reporting
    - notifications
