---
- name: Build report output metadata
  ansible.builtin.set_fact:
    linux_vitals_reports_dir: "{{ linux_vitals_output_path | dirname }}"
    linux_vitals_effective_archive_dir: "{{ linux_vitals_report_archive_dir }}"
    linux_vitals_effective_archive_timestamp: >-
      {{
        linux_vitals_archive_timestamp | trim
        if linux_vitals_archive_timestamp | trim | length > 0
        else now(utc=true, fmt='%Y%m%dT%H%M%SZ')
      }}
    linux_vitals_output_filename: "{{ linux_vitals_output_path | basename }}"
    linux_vitals_output_stem: "{{ (linux_vitals_output_path | basename | splitext)[0] }}"
    linux_vitals_output_ext: >-
      {{ (linux_vitals_output_path | basename | splitext)[1] | default('.html', true) }}
    linux_vitals_json_output_filename: "{{ linux_vitals_json_output_path | default('', true) | basename }}"
    linux_vitals_json_output_stem: "{{ (linux_vitals_json_output_path | default('', true) | basename | splitext)[0] }}"
    linux_vitals_json_output_ext: >-
      {{ (linux_vitals_json_output_path | default('', true) | basename | splitext)[1] | default('.json', true) }}
  delegate_to: localhost
  run_once: true

- name: Finalize archive file paths
  ansible.builtin.set_fact:
    linux_vitals_archive_html_path: >-
      {{
        linux_vitals_effective_archive_dir ~ '/'
        ~ linux_vitals_output_stem
        ~ '-'
        ~ linux_vitals_effective_archive_timestamp
        ~ linux_vitals_output_ext
      }}
    linux_vitals_archive_json_path: >-
      {{
        linux_vitals_effective_archive_dir ~ '/'
        ~ linux_vitals_json_output_stem
        ~ '-'
        ~ linux_vitals_effective_archive_timestamp
        ~ linux_vitals_json_output_ext
      }}
    # Retention pruning must only ever match this report's own archives (#26).
    # The glob it used, <stem>-*<ext>, also matched the archives of any report
    # whose name starts with <stem>- -- a shard writing linux_vitals_report-web.html
    # beside linux_vitals_report.html -- and because a letter sorts above a
    # digit, it kept those and deleted this report's own history instead. The
    # timestamp is matched by shape: every digit of this run's timestamp becomes
    # [0-9], so the default %Y%m%dT%H%M%SZ and a pinned timestamp of the same
    # form both match, and another report's suffix never does.
    linux_vitals_archive_html_regex: >-
      {{
        '^' ~ (linux_vitals_output_stem | regex_escape)
        ~ '-' ~ linux_vitals_archive_timestamp_shape
        ~ (linux_vitals_output_ext | regex_escape) ~ '$'
      }}
    linux_vitals_archive_json_regex: >-
      {{
        '^' ~ (linux_vitals_json_output_stem | regex_escape)
        ~ '-' ~ linux_vitals_archive_timestamp_shape
        ~ (linux_vitals_json_output_ext | regex_escape) ~ '$'
      }}
  vars:
    linux_vitals_archive_timestamp_shape: >-
      {{ linux_vitals_effective_archive_timestamp | regex_escape | regex_replace('[0-9]', '[0-9]') }}
  delegate_to: localhost
  run_once: true

- name: Ensure reports directory exists
  ansible.builtin.file:
    path: "{{ linux_vitals_reports_dir }}"
    state: directory
    mode: "{{ linux_vitals_report_dir_mode }}"
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

- name: Ensure JSON report directory exists
  ansible.builtin.file:
    path: "{{ linux_vitals_json_output_path | dirname }}"
    state: directory
    mode: "{{ linux_vitals_report_dir_mode }}"
  delegate_to: localhost
  run_once: true
  when: linux_vitals_json_output_path | trim | length > 0
  tags:
    - reporting

- name: Ensure archive directory exists
  ansible.builtin.file:
    path: "{{ linux_vitals_effective_archive_dir }}"
    state: directory
    mode: "{{ linux_vitals_report_dir_mode }}"
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_html_reports or linux_vitals_archive_json_reports

- name: Determine hosts with completed health results
  ansible.builtin.set_fact:
    linux_vitals_reporting_hosts: "{{ ansible_play_hosts | list }}"
  delegate_to: localhost
  run_once: true

- name: Collect per-host results for the fleet summary
  ansible.builtin.set_fact:
    linux_vitals_result_list: >-
      {{
        linux_vitals_reporting_hosts
        | map('extract', hostvars, 'linux_vitals_result')
        | list
      }}
  delegate_to: localhost
  run_once: true

- name: Compute the fleet pass ratio for the health score
  # A host counts towards the score only if it passes *and* every check on it
  # could run (#62). Under a raised linux_vitals_fail_on_severity a host with
  # an unknown check can still pass, but nobody looked at what that check
  # covers, so it must not make the fleet look healthier.
  ansible.builtin.set_fact:
    linux_vitals_pass_ratio_pct: >-
      {%- set healthy = [] -%}
      {%- for result in linux_vitals_result_list -%}
      {%- if result.final_status == 'Pass' and result.unknown_count | default(0) | int == 0 -%}
      {%- set _ = healthy.append(result) -%}
      {%- endif -%}
      {%- endfor -%}
      {{
        (((healthy | length) / (linux_vitals_result_list | length)) * 100) | round(1)
        if linux_vitals_result_list | length > 0
        else 0
      }}
  delegate_to: localhost
  run_once: true

- name: Count hosts with a failing final status
  ansible.builtin.set_fact:
    linux_vitals_failing_host_count: >-
      {{
        linux_vitals_result_list
        | selectattr('final_status', 'equalto', 'Fail')
        | list
        | length
      }}
  delegate_to: localhost
  run_once: true

- name: Build consolidated maintenance summary
  ansible.builtin.set_fact:
    linux_vitals_summary:
      servers_checked: "{{ linux_vitals_reporting_hosts | length }}"
      auto_fixed_count: >-
        {{
          linux_vitals_reporting_hosts
          | map('extract', hostvars, 'linux_vitals_auto_fixed_count')
          | map('default', 0)
          | map('int')
          | sum
        }}
      # Retain critical_error_count for compatibility; it has always counted
      # hosts with final_status=Fail, regardless of finding severity.
      critical_error_count: "{{ linux_vitals_failing_host_count | int }}"
      failing_host_count: "{{ linux_vitals_failing_host_count | int }}"
      health_score_pct: "{{ linux_vitals_pass_ratio_pct }}"
      health_score_band: >-
        {{
          'Excellent'
          if linux_vitals_pass_ratio_pct | float >= 95
          else 'Good'
          if linux_vitals_pass_ratio_pct | float >= 80
          else 'Fair'
          if linux_vitals_pass_ratio_pct | float >= 60
          else 'Poor'
        }}
      # Fleet rollups by severity. `hosts_by_severity` counts each host once,
      # at its highest severity, so the four numbers partition the fleet and
      # can be read as a triage queue. `findings_by_severity` counts every
      # finding, so one host with six warnings is visible as six.
      hosts_by_severity: >-
        {%- set counts = {'none': 0, 'info': 0, 'warning': 0, 'critical': 0} -%}
        {%- for result in linux_vitals_result_list -%}
        {%- set level = result.severity | default('none') -%}
        {%- set _ = counts.update({level: counts.get(level, 0) + 1}) -%}
        {%- endfor -%}
        {{ counts }}
      findings_by_severity: >-
        {%- set counts = {'info': 0, 'warning': 0, 'critical': 0} -%}
        {%- for result in linux_vitals_result_list -%}
        {%- for level in ['info', 'warning', 'critical'] -%}
        {%- set _ = counts.update({
              level: counts[level] + (result.severity_counts | default({})).get(level, 0) | int
            }) -%}
        {%- endfor -%}
        {%- endfor -%}
        {{ counts }}
      # Hosts with at least one check that could not run (#62), whatever
      # their final_status.
      unknown_host_count: >-
        {%- set hosts = [] -%}
        {%- for result in linux_vitals_result_list -%}
        {%- if result.unknown_count | default(0) | int > 0 -%}
        {%- set _ = hosts.append(result) -%}
        {%- endif -%}
        {%- endfor -%}
        {{ hosts | length }}
      fail_on_severity: "{{ linux_vitals_fail_on_severity | default('info') }}"
      comparison_active: "{{ linux_vitals_phase == 'postcheck' }}"
      regressed_count: >-
        {{
          linux_vitals_result_list
          | map(attribute='comparison')
          | selectattr('status_regressed', 'defined')
          | selectattr('status_regressed')
          | list
          | length
        }}
      improved_count: >-
        {{
          linux_vitals_result_list
          | map(attribute='comparison')
          | selectattr('status_improved', 'defined')
          | selectattr('status_improved')
          | list
          | length
        }}
      new_hosts_count: >-
        {{
          linux_vitals_result_list
          | map(attribute='comparison')
          | selectattr('baseline_available', 'equalto', false)
          | list
          | length
        }}
      snippet: >-
        {{
          (
            linux_vitals_reporting_hosts | length | string
          ) ~ ' Servers Checked, '
          ~ (
            linux_vitals_reporting_hosts
            | map('extract', hostvars, 'linux_vitals_auto_fixed_count')
            | map('default', 0)
            | map('int')
            | sum
            | string
          ) ~ ' Auto-Fixed, '
          ~ (linux_vitals_failing_host_count | int | string)
          ~ ' Failing Host'
          ~ ('s' if linux_vitals_failing_host_count | int != 1 else '')
        }}
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

- name: Generate consolidated HTML dashboard
  ansible.builtin.template:
    src: dashboard.html.j2
    dest: "{{ linux_vitals_output_path }}"
    mode: "{{ linux_vitals_report_file_mode }}"
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

- name: Generate consolidated JSON report
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ linux_vitals_json_output_path }}"
    mode: "{{ linux_vitals_report_file_mode }}"
  delegate_to: localhost
  run_once: true
  when: linux_vitals_json_output_path | trim | length > 0
  tags:
    - reporting

# Every report, archive and snapshot write in this role goes through the
# template or copy module, which writes a temporary file in the destination
# directory and rename()s it into place, so a reader -- or a concurrent run --
# only ever sees a complete file. Each run archives the report it rendered
# rather than copying linux_vitals_output_path, which by then may hold another
# run's report when two runs write the same output path (#26).
- name: Archive consolidated HTML dashboard
  ansible.builtin.template:
    src: dashboard.html.j2
    dest: "{{ linux_vitals_archive_html_path }}"
    mode: "{{ linux_vitals_report_file_mode }}"
  delegate_to: localhost
  run_once: true
  when: linux_vitals_archive_html_reports

- name: Archive JSON report
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ linux_vitals_archive_json_path }}"
    mode: "{{ linux_vitals_report_file_mode }}"
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_json_reports
    - linux_vitals_json_output_path | trim | length > 0

- name: Find archived HTML reports
  ansible.builtin.find:
    paths: "{{ linux_vitals_effective_archive_dir }}"
    file_type: file
    use_regex: true
    patterns:
      - "{{ linux_vitals_archive_html_regex }}"
  register: linux_vitals_archived_html_reports
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_html_reports
    - linux_vitals_report_retention_count | int > 0

- name: Find archived JSON reports
  ansible.builtin.find:
    paths: "{{ linux_vitals_effective_archive_dir }}"
    file_type: file
    use_regex: true
    patterns:
      - "{{ linux_vitals_archive_json_regex }}"
  register: linux_vitals_archived_json_reports
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_json_reports
    - linux_vitals_json_output_path | trim | length > 0
    - linux_vitals_report_retention_count | int > 0

- name: Sort archived HTML report paths for retention pruning
  ansible.builtin.set_fact:
    linux_vitals_archived_html_report_paths: >-
      {{
        linux_vitals_archived_html_reports.files
        | map(attribute='path')
        | sort
        | reverse
        | list
      }}
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_html_reports
    - linux_vitals_report_retention_count | int > 0

- name: Sort archived JSON report paths for retention pruning
  ansible.builtin.set_fact:
    linux_vitals_archived_json_report_paths: >-
      {{
        linux_vitals_archived_json_reports.files
        | default([])
        | map(attribute='path')
        | sort
        | reverse
        | list
      }}
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_json_reports
    - linux_vitals_json_output_path | trim | length > 0
    - linux_vitals_report_retention_count | int > 0

- name: Remove archived HTML reports beyond retention limit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ linux_vitals_archived_html_report_paths }}"
  loop_control:
    extended: true
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_html_reports
    - linux_vitals_report_retention_count | int > 0
    - ansible_loop.index0 >= (linux_vitals_report_retention_count | int)

- name: Remove archived JSON reports beyond retention limit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ linux_vitals_archived_json_report_paths }}"
  loop_control:
    extended: true
  delegate_to: localhost
  run_once: true
  when:
    - linux_vitals_archive_json_reports
    - linux_vitals_json_output_path | trim | length > 0
    - linux_vitals_report_retention_count | int > 0
    - ansible_loop.index0 >= (linux_vitals_report_retention_count | int)
