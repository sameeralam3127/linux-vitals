---
- name: Validate fleet health gate configuration
  ansible.builtin.assert:
    that:
      - linux_vitals_fail_on_status in ['', 'any_fail', 'regression']
      # Check the raw value: "two" | int is 0 and 2.5 | int is 2.
      - linux_vitals_fail_threshold_count | string is match('^[0-9]+$')
    fail_msg: >-
      linux_vitals_fail_on_status must be empty, any_fail, or regression, and
      linux_vitals_fail_threshold_count must be a whole number, zero or greater.
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

# A host that was targeted and produced no result counts against both gates
# (#147). Without that, the gate passed on the run that most needed to be
# stopped: every host that could have failed was gone from the numbers, so
# `any_fail` saw zero failing hosts and `regression` saw zero regressions.
# `regression` counts only the unreported hosts that have a baseline under this
# maintenance id -- a host with no baseline cannot have regressed, and
# `any_fail` is the gate that catches it.
- name: Compute fleet health gate failure count
  ansible.builtin.set_fact:
    linux_vitals_gate_failure_count: >-
      {{
        (linux_vitals_summary.critical_error_count | int)
        + (linux_vitals_summary.unreported_host_count | default(0) | int)
        if linux_vitals_fail_on_status == 'any_fail'
        else (linux_vitals_summary.regressed_count | int)
        + (linux_vitals_summary.missing_postcheck_count | default(0) | int)
        if (
          linux_vitals_fail_on_status == 'regression'
          and linux_vitals_phase == 'postcheck'
        )
        else 0
      }}
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

- name: Determine whether the fleet health gate should fail
  ansible.builtin.set_fact:
    linux_vitals_gate_should_fail: >-
      {{
        linux_vitals_fail_on_status | length > 0
        and (linux_vitals_gate_failure_count | int)
          > (linux_vitals_fail_threshold_count | int)
      }}
  delegate_to: localhost
  run_once: true
  tags:
    - reporting

- name: Fail the run when the configured fleet health gate is exceeded
  ansible.builtin.fail:
    msg: >-
      LinuxVitals fleet gate '{{ linux_vitals_fail_on_status }}' counted
      {{ linux_vitals_gate_failure_count }} host(s), exceeding the
      allowed threshold of {{ linux_vitals_fail_threshold_count }}.
      {{ linux_vitals_summary.unreported_host_count | default(0) | int }}
      of them produced no health result at all.
      Reports and notifications were already produced. See
      {{ linux_vitals_json_output_path | default(linux_vitals_output_path, true) }}.
  when: linux_vitals_gate_should_fail | bool
  delegate_to: localhost
  run_once: true
  tags:
    - reporting
