---
# Maintenance workflow: "adhoc" (default) is a one-shot standalone health
# check with no snapshot/comparison bookkeeping -- the classic single-run
# behavior. Set "baseline" before a maintenance window and "postcheck"
# after it, passing the same linux_vitals_maintenance_id both times, to get
# an automatic before/after comparison in the dashboard.
linux_vitals_phase: "adhoc"
linux_vitals_maintenance_id: ""
linux_vitals_snapshot_dir: "{{ inventory_dir }}/reports/snapshots"
linux_vitals_baseline_max_age_hours: 72
# Names this run's part of a snapshot set shared by several runs (a sharded
# fleet). Empty means one unsharded run. See docs/performance.md.
linux_vitals_snapshot_shard: ""

linux_vitals_output_path: "{{ inventory_dir }}/reports/linux_vitals_report.html"
linux_vitals_report_file_mode: "0644"
linux_vitals_report_dir_mode: "0755"
linux_vitals_archive_html_reports: true
linux_vitals_archive_json_reports: false
linux_vitals_json_output_path: "{{ inventory_dir }}/reports/linux_vitals_report.json"
linux_vitals_metrics_output_path: ""
linux_vitals_csv_output_path: ""
linux_vitals_report_archive_dir: "{{ linux_vitals_output_path | dirname }}/archive"
linux_vitals_report_retention_count: 10
linux_vitals_archive_timestamp: ""
linux_vitals_report_title: "LinuxVitals Health Check Dashboard"
# Optional CI/pipeline gate. Empty preserves the historical "report only"
# behavior. "any_fail" gates on failed hosts; "regression" gates only on
# Pass -> Fail changes in a postcheck.
linux_vitals_fail_on_status: ""
linux_vitals_fail_threshold_count: 0
linux_vitals_slack_webhook_url: ""
linux_vitals_slack_message_header: "LinuxVitals Health Check"
linux_vitals_slack_message_footer: ""
linux_vitals_slack_include_host_breakdown: true
# How many rows the Slack host-breakdown table may contain. Hosts are ordered
# worst-first, so the cap drops the least interesting ones; the message ends
# with a "+ N more" note whenever it bites. Clamped to 25 at render time: the
# table is one text object and Slack caps those at 3000 characters.
linux_vitals_slack_max_hosts: 20
linux_vitals_email_enabled: false
linux_vitals_email_to: []
linux_vitals_email_cc: []
linux_vitals_email_from: "linux-vitals@example.com"
linux_vitals_email_host: "localhost"
linux_vitals_email_port: 25
linux_vitals_email_secure: "never"
linux_vitals_email_username: ""
linux_vitals_email_password: ""
# Empty: the subject is generated from the result, e.g.
# "[LinuxVitals] FAIL · 7 hosts · 2 failing · 1 critical · postcheck lab-2026-10-16".
# Any other value replaces it.
linux_vitals_email_subject: ""
# html: an inline-styled HTML body. text: a plain-text body, for mail systems
# that strip or distrust HTML.
linux_vitals_email_format: "html"
# Attach the HTML dashboard (linux_vitals_output_path) to the email. It holds
# every host's details, so it puts them into every recipient's mailbox; see
# docs/threat-model.md.
linux_vitals_email_attach_report: true
linux_vitals_generic_webhook_enabled: false
linux_vitals_generic_webhook_url: ""
linux_vitals_generic_webhook_headers: {}
linux_vitals_generic_webhook_status_code: 200

# Paging (#65). One PagerDuty event, or one Opsgenie alert, per host that has a
# finding worth waking someone for. Both are off by default, and neither is
# sent without a key: a pager that is switched on but silently has nowhere to
# send is worse than one that fails the run, so that case is an error.
#
# Only a `fail` finding at or above linux_vitals_paging_min_severity pages. An
# `unknown` finding -- a check that could not run -- never pages and never
# raises a page's severity: it is listed in the details of a page that is sent
# for the same host, and is otherwise left to the report. See
# docs/configuration-reference.md#paging.
linux_vitals_paging_min_severity: "critical"

# Seconds to wait before re-sending an event the service answered with 429 or
# a 5xx, or that never connected. At most three more attempts are made.
linux_vitals_paging_retry_delay: 5

linux_vitals_pagerduty_enabled: false
# The 32-character integration (routing) key of a PagerDuty Events API v2
# integration. Falls back to PAGERDUTY_ROUTING_KEY in .env when blank. A
# credential: never commit it, and prefer .env or a vault.
linux_vitals_pagerduty_routing_key: ""
# Override for a different PagerDuty service region.
linux_vitals_pagerduty_events_url: "https://events.pagerduty.com/v2/enqueue"

# Atlassian ended Opsgenie sales on 4 June 2025 and ends support on 5 April
# 2027, so this is for teams that still run it. Falls back to OPSGENIE_API_KEY
# in .env when blank.
linux_vitals_opsgenie_enabled: false
linux_vitals_opsgenie_api_key: ""
# Override for the EU instance or another region.
linux_vitals_opsgenie_alerts_url: "https://api.opsgenie.com/v2/alerts"
