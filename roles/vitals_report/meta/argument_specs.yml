---
# Machine-readable counterpart to docs/variable-reference.md: this is what
# `ansible-doc -t role sameeralam3127.linux_vitals.vitals_report` renders, and
# what validates an operator's overrides at role entry rather than deep inside
# a Jinja expression.
#
# Nothing here is `required`. In particular linux_vitals_maintenance_id is NOT
# marked required even though baseline/postcheck runs need it: that requirement
# is conditional on the phase, and tasks/snapshot.yml already asserts it with a
# message that names the phase and shows the -e invocation to fix it.
argument_specs:
  main:
    short_description: Fleet-wide HTML/JSON reporting, baseline comparison, and notifications
    description:
      - Loads notification configuration, persists baseline/postcheck snapshots,
        computes the before/after comparison, renders the HTML dashboard and
        JSON report, archives historical reports, and sends Slack, email, and
        generic-webhook summaries.
      - Runs on the control node. Managed hosts never receive credentials.
    author:
      - Sameer Alam
    options:
      linux_vitals_phase:
        type: str
        default: adhoc
        choices: [adhoc, baseline, postcheck]
        description:
          - C(adhoc) is a one-shot health check with no snapshot or comparison
            bookkeeping.
          - C(baseline) persists a pre-maintenance snapshot; C(postcheck)
            persists a post-maintenance snapshot and compares it against the
            matching baseline.
          - Set by the shipped baseline.yml and postcheck.yml playbooks; there
            is normally no reason to set it by hand.
      linux_vitals_maintenance_id:
        type: str
        default: ""
        description:
          - Correlates a baseline snapshot with its postcheck. Reuse the same
            value for both runs of a maintenance window.
          - Must be non-empty when C(linux_vitals_phase) is C(baseline) or
            C(postcheck); the role asserts this at run time.
          - Leading and trailing spaces are trimmed. The value must not
            contain a forward slash or backslash, any control characters, or
            start with a dot, because it names a directory below
            C(linux_vitals_snapshot_dir).
      linux_vitals_snapshot_dir:
        type: str
        default: "{{ inventory_dir }}/reports/snapshots"
        description:
          - Root directory for per-host, per-phase JSON snapshots.
          - Anchored to C(inventory_dir) rather than C(playbook_dir) so it
            resolves inside your project when the collection is installed and
            invoked by FQCN.
      linux_vitals_baseline_max_age_hours:
        type: int
        default: 72
        description:
          - Maximum baseline age shown as a warning during postcheck.
          - Set to C(0) to disable the age warning; capture times and unknown
            ages are still shown.
          - Must be non-negative.
      linux_vitals_snapshot_shard:
        type: str
        default: ""
        description:
          - Names this run's part of a snapshot set that several runs share,
            for a fleet sharded into runs with one C(linux_vitals_maintenance_id).
            Give each shard its own id; baseline and postcheck shards do not
            have to match.
          - Each run records its hosts in
            C(<snapshot_dir>/<maintenance_id>/<phase>/.shards/<shard>.json). A
            run whose shard id was recorded with other hosts fails before
            writing any snapshot. Re-running all or some of a shard's hosts is
            allowed.
          - Empty records the run as shard C(default) and only warns when the
            host set differs, which keeps sequential per-group runs that share
            a maintenance id working.
          - Letters, digits, C(.), C(_) and C(-), starting with a letter or
            digit.
      linux_vitals_output_path:
        type: str
        default: "{{ inventory_dir }}/reports/linux_vitals_report.html"
        description:
          - Where the self-contained HTML dashboard is written.
      linux_vitals_report_file_mode:
        type: str
        default: "0644"
        description:
          - Mode for generated HTML/JSON reports, archives, and per-host snapshots.
          - Set to C(0600) to restrict report contents to the automation user.
      linux_vitals_report_dir_mode:
        type: str
        default: "0755"
        description:
          - Mode for report, archive, and snapshot directories created by the role.
          - Set to C(0700) alongside C(linux_vitals_report_file_mode=0600)
            to restrict traversal to the automation user.
      linux_vitals_json_output_path:
        type: str
        default: "{{ inventory_dir }}/reports/linux_vitals_report.json"
        description:
          - Where the JSON report is written. Set to an empty string to skip
            JSON generation entirely.
      linux_vitals_metrics_output_path:
        type: str
        default: ""
        description:
          - Optional Prometheus textfile destination on the control node.
          - Empty disables this export. Use a C(.prom) filename in the
            node_exporter textfile collector directory to enable scraping.
      linux_vitals_csv_output_path:
        type: str
        default: ""
        description:
          - Optional CSV fleet-table destination on the control node.
          - Empty disables this export. Writes one row per completed host
            result, including checks that could not run.
      linux_vitals_report_title:
        type: str
        default: LinuxVitals Health Check Dashboard
        description:
          - Title used for the dashboard's HTML C(<title>) and hero heading.
      linux_vitals_fail_on_status:
        type: str
        default: ""
        choices: ["", any_fail, regression]
        description:
          - Optional pipeline gate, evaluated after reports, archives and
            notifications are produced. Empty keeps the report-only behavior.
          - C(any_fail) fails the run when more failed hosts than
            C(linux_vitals_fail_threshold_count) are found.
          - C(regression) fails the run only when, in a C(postcheck), more
            hosts than the threshold went from C(Pass) at baseline to C(Fail).
      linux_vitals_fail_threshold_count:
        type: int
        default: 0
        description:
          - Number of failing (or regressed) hosts the gate tolerates. The run
            fails only when the count is above this value.
      linux_vitals_archive_html_reports:
        type: bool
        default: true
        description:
          - Copy the HTML dashboard into C(linux_vitals_report_archive_dir) with
            a UTC timestamp on every run.
      linux_vitals_archive_json_reports:
        type: bool
        default: false
        description:
          - Same as C(linux_vitals_archive_html_reports), for the JSON report.
      linux_vitals_report_archive_dir:
        type: str
        default: "{{ linux_vitals_output_path | dirname }}/archive"
        description:
          - Where archived, timestamped copies of the reports are stored.
      linux_vitals_report_retention_count:
        type: int
        default: 10
        description:
          - Keep only the newest N archived files per artefact type. Set to C(0)
            to disable pruning and keep everything.
          - Only this report's own archives, C(<stem>-<timestamp><ext>), are
            counted and pruned. Another report sharing the archive directory is
            left alone, even when its name starts with this one's.
      linux_vitals_archive_timestamp:
        type: str
        default: ""
        description:
          - Override the UTC timestamp used for this run's archive filenames.
          - Exists mainly so tests can produce deterministic filenames; blank
            means "now".
          - Pruning matches archives whose timestamp has the same shape as this
            one, digits where it has digits, so keep to one format.
      linux_vitals_slack_webhook_url:
        type: str
        default: ""
        description:
          - Slack incoming webhook URL. Falls back to C(SLACK_WEBHOOK_URL) in
            the C(.env) beside your inventory when blank; blank in both places
            skips Slack.
          - This value is a credential -- an incoming webhook URL is the bearer
            token for that channel. Keep it in C(.env) or a vaulted variable,
            never in inventory committed to git.
      linux_vitals_slack_message_header:
        type: str
        default: LinuxVitals Health Check
        description:
          - Heading shown at the top of the Slack message. The footer always
            names LinuxVitals regardless of this value, so the message stays
            identifiable in a busy channel when it is customised.
      linux_vitals_slack_message_footer:
        type: str
        default: ""
        description:
          - Optional last line of the Slack message. Blank omits it.
      linux_vitals_slack_include_host_breakdown:
        type: bool
        default: true
        description:
          - Include the per-host breakdown table in the Slack message.
      linux_vitals_slack_max_hosts:
        type: int
        default: 20
        description:
          - Maximum number of rows in the Slack host-breakdown table. Hosts are
            ordered worst-first, so the cap drops the least interesting ones,
            and the message gains a C(+ N more host(s) not shown) note whenever
            it applies.
          - Clamped to 25 at render time regardless of this value. The table is
            a single text object and Slack caps those at 3000 characters,
            rejecting anything longer with a bare HTTP 400 that says nothing
            about the cause.
      linux_vitals_email_enabled:
        type: bool
        default: false
        description:
          - Must be C(true), with at least one recipient in
            C(linux_vitals_email_to), for email to send.
      linux_vitals_email_to:
        type: list
        elements: str
        default: []
        description:
          - Recipient addresses. An empty list skips email even when
            C(linux_vitals_email_enabled) is true.
      linux_vitals_email_cc:
        type: list
        elements: str
        default: []
        description:
          - CC addresses. An empty list omits the header entirely.
      linux_vitals_email_from:
        type: str
        default: linux-vitals@example.com
        description:
          - Envelope and header sender address. Change this -- the default is a
            placeholder that many SMTP servers will reject.
      linux_vitals_email_host:
        type: str
        default: localhost
        description:
          - SMTP server hostname. Falls back to C(EMAIL_SMTP_HOST) in C(.env)
            when left at the C(localhost) default.
      linux_vitals_email_port:
        type: int
        default: 25
        description:
          - SMTP server port. Use C(587) with C(starttls) or C(465) with
            C(always) for authenticated submission.
      linux_vitals_email_secure:
        type: str
        default: never
        choices: [never, starttls, try, always]
        description:
          - Transport security mode passed through to C(community.general.mail).
          - C(try) attempts STARTTLS and silently continues in plain text if it
            is unavailable, so prefer C(starttls) or C(always) when credentials
            are involved.
      linux_vitals_email_username:
        type: str
        default: ""
        description:
          - SMTP username. Falls back to C(EMAIL_SMTP_USERNAME) in C(.env) when
            blank; blank in both places means no authentication.
      linux_vitals_email_password:
        type: str
        default: ""
        description:
          - SMTP password. Falls back to C(EMAIL_SMTP_PASSWORD) in C(.env) when
            blank.
          - This value is a credential. Keep it in C(.env) or a vaulted
            variable, never in inventory committed to git.
      linux_vitals_email_subject:
        type: str
        default: ""
        description:
          - Subject line of the summary email. Empty generates one that carries
            the result, for example
            C([LinuxVitals] FAIL · 7 hosts · 2 failing · 1 critical · postcheck lab-2026-10-16).
          - Any other value replaces the generated subject. Control characters,
            newlines among them, are replaced with spaces either way.
      linux_vitals_email_format:
        type: str
        default: html
        choices: [html, text]
        description:
          - C(html) sends an inline-styled HTML body. C(text) sends a plain-text
            body with the same content, one short block per host.
      linux_vitals_email_attach_report:
        type: bool
        default: true
        description:
          - Attach the HTML dashboard (C(linux_vitals_output_path)) to the
            email. Skipped, and the body names the path instead, when the
            dashboard file does not exist.
          - The dashboard holds every host's details, so this puts them into
            every recipient's mailbox. Set C(false) where that is not wanted.
      linux_vitals_generic_webhook_enabled:
        type: bool
        default: false
        description:
          - Must be C(true), with a non-empty URL, for the generic webhook to
            post.
      linux_vitals_generic_webhook_url:
        type: str
        default: ""
        description:
          - Generic webhook endpoint. Falls back to C(GENERIC_WEBHOOK_URL) in
            C(.env) when blank.
          - Treat as a credential if the endpoint authenticates by URL. Keep it
            in C(.env) or a vaulted variable.
      linux_vitals_generic_webhook_headers:
        type: dict
        default: {}
        description:
          - Extra HTTP headers sent with the generic webhook request. This is
            the documented place for an C(Authorization) header.
          - Treat as a credential. The sending task runs with C(no_log) so a
            failed post cannot print these.
      linux_vitals_generic_webhook_status_code:
        type: int
        default: 200
        description:
          - HTTP status code the endpoint is expected to return. Anything else
            is reported as a delivery failure.
          - Set to C(202) or C(204) for endpoints that acknowledge
            asynchronously or return no content.
      linux_vitals_paging_min_severity:
        type: str
        default: "critical"
        choices:
          - info
          - warning
          - critical
        description:
          - The lowest severity of a C(fail) finding that pages. A host is paged
            when it has at least one C(fail) finding at or above this.
          - The default pages only for C(critical). The page's own severity is
            that of the worst such finding.
          - An C(unknown) finding never pages, whatever its severity, and never
            raises a page's severity. It is listed under C(unknown_checks) in
            the details of a page sent for the same host, so a check that could
            not run is not dropped from the page. A host that could not be
            scanned at all is not paged either.
      linux_vitals_paging_retry_delay:
        type: int
        default: 5
        description:
          - Seconds to wait before re-sending an event that the service answered
            with HTTP 429 or a 5xx, or that could not be delivered at all.
          - At most three more attempts are made. Any other refusal, such as a
            malformed event or a rejected key, is not retried.
      linux_vitals_pagerduty_enabled:
        type: bool
        default: false
        description:
          - Send a PagerDuty Events API v2 event for each host that warrants a
            page. When C(true) a routing key is required; a missing key fails
            the run rather than silently paging nobody.
      linux_vitals_pagerduty_routing_key:
        type: str
        default: ""
        description:
          - The integration (routing) key of a PagerDuty Events API v2
            integration. Falls back to C(PAGERDUTY_ROUTING_KEY) in C(.env) when
            blank.
          - A credential. It is only ever placed in the request body inside a
            C(no_log) task, never in a report, a rendered event or an error
            message.
      linux_vitals_pagerduty_events_url:
        type: str
        default: "https://events.pagerduty.com/v2/enqueue"
        description:
          - The Events API v2 endpoint. Change it for a PagerDuty service region
            that uses a different host.
      linux_vitals_opsgenie_enabled:
        type: bool
        default: false
        description:
          - Send an Opsgenie alert for each host that warrants a page. When
            C(true) an API key is required.
          - Atlassian ended Opsgenie sales on 4 June 2025 and ends support on
            5 April 2027. This is for teams that still run it.
      linux_vitals_opsgenie_api_key:
        type: str
        default: ""
        description:
          - The Opsgenie API integration key. Falls back to C(OPSGENIE_API_KEY)
            in C(.env) when blank.
          - A credential, handled the same way as the PagerDuty routing key.
      linux_vitals_opsgenie_alerts_url:
        type: str
        default: "https://api.opsgenie.com/v2/alerts"
        description:
          - The Opsgenie Create Alert endpoint. Change it for the EU instance or
            another region.
