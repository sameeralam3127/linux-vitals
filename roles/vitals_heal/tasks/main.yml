---
- name: Attempt self-healing for failed enabled services
  when: linux_vitals_heal_enabled | bool
  tags:
    - self_healing
  block:
    - name: Identify failed services
      # service_facts describes a failed systemd unit as state "stopped" with
      # status "failed" -- the unit-file state (enabled/disabled) is replaced by
      # "failed", so it cannot be used to tell enabled units apart here. Older
      # ansible-core reported state "failed" instead, so both are accepted.
      ansible.builtin.set_fact:
        linux_vitals_failed_services: >-
          {{
            (
              (
                ansible_facts.services
                | dict2items
                | selectattr('value.state', 'defined')
                | selectattr('value.state', 'equalto', 'failed')
                | map(attribute='key')
                | list
              )
              + (
                ansible_facts.services
                | dict2items
                | selectattr('value.status', 'defined')
                | selectattr('value.status', 'equalto', 'failed')
                | map(attribute='key')
                | list
              )
            )
            | unique
            | list
          }}

    - name: Check whether each failed service is enabled
      # Asked per unit because service_facts no longer carries the unit-file
      # state for failed units. `is-enabled` also answers static/indirect/masked
      # with rc 0, so the answer is read from stdout rather than the exit code.
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item }}"
      register: linux_vitals_enabled_checks
      changed_when: false
      failed_when: false
      loop: "{{ linux_vitals_failed_services }}"
      when: ansible_facts['service_mgr'] == 'systemd'

    - name: Keep only the failed services that are enabled at boot
      ansible.builtin.set_fact:
        linux_vitals_failed_enabled_services: >-
          {{
            linux_vitals_enabled_checks.results
            | default([])
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'search', '^enabled')
            | map(attribute='item')
            | list
          }}

    - name: Attempt one restart for enabled failed services
      # A restart that errors is recorded, not fatal. `ignore_errors` rather
      # than `failed_when: false`, because failed_when overwrites each item's
      # `failed` flag, so an errored restart looked like a successful one. The
      # unit's state is still checked below: a start job that failed leaves a
      # failed unit (Failed to Fix, as before), and only a restart that errored
      # without that -- the unit missing, its state unreadable -- is
      # restart_error.
      #
      # For a failed unit, `state: restarted` runs `systemctl start`, which
      # waits for the start job. A Type=notify unit such as sssd is therefore
      # already ready, or already failed, when this returns. A Type=simple unit
      # counts as started as soon as it has forked, so it can still die a
      # moment later -- which is why the outcome is verified below rather than
      # read off this result.
      ansible.builtin.service:
        name: "{{ item | regex_replace('\\.service$', '') }}"
        state: restarted
      loop: "{{ linux_vitals_failed_enabled_services }}"
      register: linux_vitals_restart_attempts
      ignore_errors: true
      when: linux_vitals_failed_enabled_services | length > 0

    # Verifying the restarts (#24). Reaching `active` is not the same as
    # staying active, so a unit is judged in two looks with a window between
    # them:
    #
    #   1. Poll until the unit settles -- active, failed or inactive -- or the
    #      settle budget runs out.
    #   2. If it came up, wait linux_vitals_heal_stability_seconds, then look
    #      again. It is Fixed only if it is still active on the same run: the
    #      same InvocationID and the same NRestarts. Either changing means
    #      systemd restarted it in between, which is a crash that recovered,
    #      not a fix that held.
    #
    # A unit whose restart command errored gets the first look only -- it is
    # never Fixed, so there is nothing for the window to confirm -- which is
    # what tells a start job that failed from a restart that never ran.
    #
    # Both polls stop on their own when the budget is spent instead of letting
    # `retries` run out, because running out marks the task failed and a unit
    # that never settled is a result to record (unknown), not an error. A
    # `systemctl show` that cannot run ends the poll at once for the same
    # reason. The outcome is derived in "Summarize self-healing outcomes".
    - name: Wait for each restarted unit to settle
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=LoadState,ActiveState,SubState,Result,InvocationID,NRestarts
          - --
          - "{{ item }}"
      loop: >-
        {{
          linux_vitals_restart_attempts.results | default([])
          | map(attribute='item')
          | list
        }}
      register: linux_vitals_heal_settle_checks
      changed_when: false
      failed_when: false
      retries: "{{ linux_vitals_heal_settle_retries | int }}"
      delay: "{{ linux_vitals_heal_settle_delay | int }}"
      until: >-
        linux_vitals_heal_settle_checks.rc | default(1) != 0
        or linux_vitals_heal_settle_checks.stdout_lines | default([])
           | intersect(['ActiveState=active', 'ActiveState=failed', 'ActiveState=inactive'])
           | length > 0
        or linux_vitals_heal_settle_checks.attempts | default(0) | int
           > linux_vitals_heal_settle_retries | int

    - name: Note which restarted units came up
      # Units whose restart command errored are left out: they are never
      # Fixed, so they do not go through the stability window.
      ansible.builtin.set_fact:
        linux_vitals_heal_came_up: >-
          {{
            linux_vitals_heal_settle_checks.results | default([])
            | selectattr('stdout_lines', 'defined')
            | selectattr('stdout_lines', 'contains', 'ActiveState=active')
            | map(attribute='item')
            | reject('in', linux_vitals_restart_attempts.results | default([])
                           | selectattr('failed', 'equalto', true)
                           | map(attribute='item') | list)
            | list
          }}

    - name: Give the units that came up time to prove they stay up
      # Once per host, not once per unit. Skipped when nothing came up.
      ansible.builtin.wait_for:
        timeout: "{{ [linux_vitals_heal_stability_seconds | int, 0] | max }}"
      when: linux_vitals_heal_came_up | length > 0

    - name: Check the units that came up are still up on the same run
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=LoadState,ActiveState,SubState,Result,InvocationID,NRestarts
          - --
          - "{{ item }}"
      loop: "{{ linux_vitals_heal_came_up }}"
      register: linux_vitals_heal_stability_checks
      changed_when: false
      failed_when: false
      retries: "{{ linux_vitals_heal_settle_retries | int }}"
      delay: "{{ linux_vitals_heal_settle_delay | int }}"
      until: >-
        linux_vitals_heal_stability_checks.rc | default(1) != 0
        or linux_vitals_heal_stability_checks.stdout_lines | default([])
           | intersect(['ActiveState=active', 'ActiveState=failed', 'ActiveState=inactive'])
           | length > 0
        or linux_vitals_heal_stability_checks.attempts | default(0) | int
           > linux_vitals_heal_settle_retries | int

    - name: Refresh service facts after self-healing attempts
      # Read after verification, so the required-service status refreshed
      # below sees the settled state rather than a unit mid-transition.
      ansible.builtin.service_facts:
      when: linux_vitals_failed_enabled_services | length > 0

    - name: Summarize self-healing outcomes
      # Each attempt ends in one of three outcomes -- fixed, still_failed or
      # unknown -- with a stable `reason` code saying why and a `detail`
      # sentence for a human. `result` keeps its three values and their
      # meaning, so a consumer that only knows `result` reads every outcome
      # correctly: only a verified fix is Fixed.
      #
      #   result                        outcome       reason
      #   Fixed                         fixed         stayed_active
      #   Failed to Fix                 still_failed  failed, restarted_during_check
      #   Manual Intervention Required  still_failed  restart_error, inactive
      #   Manual Intervention Required  unknown       not_settled, check_failed
      #
      # `failed` includes a restart whose command errored because the start
      # job failed (a Type=notify or forking unit that cannot start): the unit
      # is failed, so it is Failed to Fix, as it always was. `restart_error` is
      # only a restart that errored without leaving a failed unit behind -- the
      # unit not found, permission denied, its state unreadable.
      #
      # `unknown` is the answer when the check itself could not complete: the
      # unit was still changing state when the budget ran out, or
      # `systemctl show` could not be read. It never reads as Fixed, and
      # vitals_scan turns it into an `unknown` finding with the detail as its
      # reason (#62).
      ansible.builtin.set_fact:
        linux_vitals_healing_results: >-
          {%- set observed = {'first': {}, 'final': {}} -%}
          {%- set registers = {
                'first': linux_vitals_heal_settle_checks | default({}),
                'final': linux_vitals_heal_stability_checks | default({}),
              } -%}
          {%- for phase in ['first', 'final'] -%}
          {%- for check in registers[phase].results | default([]) if check.item is defined -%}
          {%- set props = {
                'rc': check.rc | default(1) | int,
                'error': (check.stderr | default('', true) or check.msg | default('', true)) | trim,
              } -%}
          {%- for line in check.stdout_lines | default([]) -%}
          {%- set pair = line.split('=', 1) -%}
          {%- if pair | length == 2 -%}
          {%- set _ = props.update({pair[0]: pair[1]}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set _ = observed[phase].update({check.item: props}) -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- set window = linux_vitals_heal_stability_seconds | int -%}
          {%- set budget = (linux_vitals_heal_settle_retries | int) * (linux_vitals_heal_settle_delay | int) -%}
          {%- set outcomes = [] -%}
          {%- for attempt in linux_vitals_restart_attempts.results | default([]) -%}
          {%- set key = attempt.item -%}
          {%- set errored = attempt.failed | default(false) -%}
          {%- set error_line = (attempt.msg | default('', true) | trim).splitlines() | first | default('no error message', true) -%}
          {%- set first = observed.first.get(key, {}) -%}
          {%- set came_up = not errored and first.rc | default(1) == 0 and first.ActiveState | default('') == 'active' -%}
          {#- A unit that came up is judged on the second look only. If that
              look is missing, the answer is unknown -- never the first look's
              optimistic "active". -#}
          {%- set final = observed.final.get(key, {}) if came_up else first -%}
          {%- set state = final.ActiveState | default('') -%}
          {%- set why = (final.Result | default('', true)) -%}
          {#- A restart that errored is never Fixed. If it left the unit
              failed, the start job ran and failed: Failed to Fix, as it has
              always been reported. Otherwise -- the unit missing, its state
              unreadable, or anything but failed -- the restart itself is
              what went wrong. -#}
          {%- if errored and final.rc | default(1) == 0 and state == 'failed'
                and final.LoadState | default('') != 'not-found' -%}
          {%- set entry = ('Failed to Fix', 'still_failed', 'failed',
                'the restart reported an error and it failed again'
                ~ (' (result: ' ~ why ~ ')' if why else '') ~ ': ' ~ error_line) -%}
          {%- elif errored -%}
          {%- set entry = ('Manual Intervention Required', 'still_failed', 'restart_error',
                'the restart command failed: ' ~ error_line) -%}
          {%- elif final.rc | default(1) != 0 or state == '' -%}
          {%- set entry = ('Manual Intervention Required', 'unknown', 'check_failed',
                'its state could not be read after the restart: '
                ~ (final.error | default('', true) or 'systemctl show returned nothing')) -%}
          {%- elif state == 'failed' -%}
          {%- set entry = ('Failed to Fix', 'still_failed', 'failed',
                ('it came up, then failed within ' ~ window ~ ' s' if came_up else 'it failed again after the restart')
                ~ (' (result: ' ~ why ~ ')' if why else '')) -%}
          {%- elif state == 'inactive' -%}
          {%- set entry = ('Manual Intervention Required', 'still_failed', 'inactive',
                'it is inactive after the restart' ~ (' (result: ' ~ why ~ ')' if why else '')) -%}
          {%- elif came_up and (final.InvocationID | default('') != first.InvocationID | default('')
                or final.NRestarts | default('') != first.NRestarts | default('')) -%}
          {%- set entry = ('Failed to Fix', 'still_failed', 'restarted_during_check',
                'systemd restarted it during the ' ~ window ~ ' s stability window, so the restart did not hold') -%}
          {%- elif state == 'active' and came_up -%}
          {%- set entry = ('Fixed', 'fixed', 'stayed_active',
                'it stayed active for ' ~ window ~ ' s after the restart') -%}
          {%- else -%}
          {%- set entry = ('Manual Intervention Required', 'unknown', 'not_settled',
                'it was still ' ~ state ~ ' (' ~ final.SubState | default('') ~ ') when the '
                ~ budget ~ ' s settle budget ran out') -%}
          {%- endif -%}
          {%- set _ = outcomes.append({
                'service': key,
                'result': entry[0],
                'outcome': entry[1],
                'reason': entry[2],
                'detail': entry[3],
              }) -%}
          {%- endfor -%}
          {{ outcomes }}

    - name: Finalize healing counters
      ansible.builtin.set_fact:
        linux_vitals_services_healed: >-
          {{
            linux_vitals_healing_results
            | selectattr('result', 'equalto', 'Fixed')
            | map(attribute='service')
            | list
          }}
        linux_vitals_auto_fixed_count: >-
          {{
            linux_vitals_healing_results
            | selectattr('result', 'equalto', 'Fixed')
            | list
            | length
          }}

    - name: Refresh required service status after healing
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_scan
        tasks_from: services.yml

    - name: Rebuild the host health result with the self-healing outcomes
      # vitals_scan builds linux_vitals_result before this role runs, so at that
      # point healing_results/services_healed are still empty and the refreshed
      # service states above have not been re-evaluated. Rebuilding the result
      # here is what puts the healing outcomes -- and the "requires manual
      # follow-up" findings -- into the report.
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_scan
        tasks_from: result.yml
      when:
        - linux_vitals_failed_enabled_services | length > 0
        - linux_vitals_result is defined
