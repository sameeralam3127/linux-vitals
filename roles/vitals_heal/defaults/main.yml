---
# Self-healing is opt-in: set this to true (globally or per-group) to let the
# role attempt one restart of each systemd-enabled service it finds in a
# failed state. Leave it false to run linux_vitals as a read-only health
# check with no write actions against managed hosts.
linux_vitals_heal_enabled: false

# How a restart is verified before it is reported as Fixed (#24). After the
# restarts, each unit is polled with `systemctl show` until it is active,
# failed or inactive -- up to linux_vitals_heal_settle_retries more times,
# linux_vitals_heal_settle_delay seconds apart (30 s by default). A unit that
# came up must then still be active, on the same run, after
# linux_vitals_heal_stability_seconds; one that died or was restarted by
# systemd in that window is not Fixed. A unit still starting or stopping when
# the budget runs out is recorded as unknown, never as Fixed.
#
# None of this runs on a host where nothing was restarted. Where something
# was, the stability window is waited out once per host, not once per unit.
linux_vitals_heal_settle_retries: 10
linux_vitals_heal_settle_delay: 3
linux_vitals_heal_stability_seconds: 5

# The longest one restart may block the run before the role stops waiting for
# it and lets the settle poll above judge the unit (#151). `state: restarted`
# runs `systemctl start`, which waits for the start job, and the only other
# bound is the unit's own TimeoutStartSec= -- which systemd disables by default
# for Type=oneshot. One enabled oneshot that hangs on a mount, a lock or a
# metadata service otherwise blocks this role forever, and with the linear
# strategy the whole fleet waits at that task: no host reaches vitals_report,
# so the run produces no dashboard, no JSON report and no notification.
#
# 120 s is above systemd's own 90 s default start timeout, so a unit with any
# finite TimeoutStartSec= still reaches its own verdict first and nothing that
# completes today is cut short. Cutting the wait short does not cancel the
# start job: systemd carries on with it, and the unit is reported
# `unknown`/`restart_timeout` rather than fixed or failed. Raise it for hosts
# with legitimately long-running oneshot jobs, or put those units in
# linux_vitals_heal_exclude_services; 0 waits as long as it takes, which is
# what the role did before this bound existed.
linux_vitals_heal_restart_timeout: 120

# Which failed units self-healing may restart (#148). Patterns are matched
# against the unit name as service_facts reports it, with `.service` optional,
# and accept the globs `*` and `?`. The defaults are today's behaviour: every
# unit that is failed and enabled at boot is in scope.
#
# linux_vitals_heal_exclude_services wins over the include list. A unit left
# out by either is never restarted and gets no linux_vitals_healing_results
# entry; it is listed in the report under self_healing.skipped_by_policy with
# the reason it was left alone, so a skip is never silent.
linux_vitals_heal_include_services:
  - "*"
linux_vitals_heal_exclude_services: []

# The most units one run may restart on one host; 0 (the default) means no
# limit. Over the limit, the host is left entirely alone rather than having an
# arbitrary subset of its units restarted: twenty units failing at once is
# usually one cause a restart will not fix -- a full disk, a failed mount, a
# bad config push -- and that is exactly when restarting everything is most
# likely to make things worse. Every in-scope unit is then reported as skipped
# with reason `over_max_restarts`.
linux_vitals_heal_max_restarts: 0

# The time of day, on the managed host's own clock, when self-healing may act.
# Both empty (the default) means any time. Both must be set together, as
# 24-hour "HH:MM"; an end before the start spans midnight ("22:00" to "02:00").
# Outside the window nothing is restarted and every in-scope unit is reported
# as skipped with reason `outside_window`.
#
# The clock is read on the host at the moment the decision is made, not taken
# from gathered facts, which are a snapshot from the start of the play. A host
# whose clock cannot be read is left alone (reason `window_unknown`): a
# configured window that cannot be evaluated must not become no window at all.
# Note these are unrelated to linux_vitals_heal_stability_seconds above, which
# is how long a restarted unit must stay up, not when a restart is permitted.
linux_vitals_heal_window_start: ""
linux_vitals_heal_window_end: ""
