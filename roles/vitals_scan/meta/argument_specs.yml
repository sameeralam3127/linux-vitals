---
# Machine-readable counterpart to docs/variable-reference.md: this is what
# `ansible-doc -t role sameeralam3127.linux_vitals.vitals_scan` renders, and
# what validates an operator's overrides at role entry rather than deep inside
# a Jinja expression.
#
# Nothing here is `required`. Every variable has a working default and the role
# must stay runnable with no configuration at all.
argument_specs:
  main:
    short_description: Read-only Linux host discovery, posture checks, and findings
    description:
      - Gathers facts, journal and log posture, kernel and bootloader state,
        boot-partition health, security controls, and failed-login data.
      - Builds one C(linux_vitals_result) fact per host with a C(final_status)
        of C(Pass) or C(Fail) and a list of C(findings).
      - Never changes anything on the managed host.
    author:
      - Sameer Alam
    options:
      linux_vitals_log_window:
        type: str
        default: "30 minutes ago"
        description:
          - How far back C(journalctl) is scanned for C(error)/C(failed) lines
            that feed the C(log_errors) count.
          - Passed to C(journalctl --since) as a single argument, so any value
            that option accepts works.
      linux_vitals_audit_log_window:
        type: str
        default: "7 days ago"
        description:
          - How far back C(journalctl) is scanned for kernel, grub, dracut, and
            initramfs failure lines.
          - Longer than C(linux_vitals_log_window) because a failed kernel
            install is worth catching well after the fact.
      linux_vitals_ram_warning_threshold:
        type: int
        default: 80
        description:
          - RAM used percentage at or above which C(ram_status) becomes
            C(Warning).
          - A warning does not fail the host on its own.
      linux_vitals_ram_critical_threshold:
        type: int
        default: 95
        description:
          - RAM used percentage at or above which C(ram_status) becomes
            C(Critical), which produces a finding and fails the host.
      linux_vitals_boot_warning_threshold:
        type: int
        default: 20
        description:
          - Boot partition free percentage below which C(boot_space_status)
            becomes C(Low), which produces a finding and fails the host.
          - Note this is a I(free) percentage, unlike the RAM thresholds, which
            are I(used) percentages.
      linux_vitals_severity_order:
        type: list
        elements: str
        default:
          - info
          - warning
          - critical
        description:
          - The severity ladder, least to most severe.
          - Used to rank a host's findings into one C(severity), and to decide
            which findings clear C(linux_vitals_fail_on_severity).
          - Changing the order, rather than extending it, will confuse both.
      linux_vitals_finding_severities:
        type: dict
        # Repeated from defaults/main.yml rather than referenced, because
        # `ansible-doc` renders this file on its own. test_argument_specs.py
        # asserts the two stay identical.
        default:
          ram_critical: critical
          journald_inactive: critical
          service_manual_followup: critical
          boot_space_low: warning
          reboot_required: warning
          kernel_not_latest: warning
          bootloader_mismatch: warning
          kernel_install_failures: warning
          sssd_inactive: warning
          time_sync_absent: warning
          time_sync_inactive: warning
          selinux_disabled: warning
          apparmor_disabled: warning
          log_errors: info
          failed_logins: info
        description:
          - Maps each finding id to C(info), C(warning), or C(critical).
          - Prefer C(linux_vitals_finding_severity_overrides) for retuning a
            single finding; replacing this whole map means findings added in a
            later release have no entry and fall back to C(warning).
      linux_vitals_finding_severity_overrides:
        type: dict
        default: {}
        description:
          - Per-finding severity overrides, merged over
            C(linux_vitals_finding_severities).
          - 'Example: C({apparmor_disabled: info, reboot_required: critical}).'
      linux_vitals_fail_on_severity:
        type: str
        default: info
        choices:
          - info
          - warning
          - critical
        description:
          - The severity at which a finding makes a host C(Fail).
          - The default C(info) means any finding fails the host, which is how
            every release before severity existed behaved.
          - Raising it to C(warning) or C(critical) is what turns severity into
            triage - every finding is still reported, but only ones at or above
            this level count against the host. This changes C(final_status) and
            therefore the fleet health score.
