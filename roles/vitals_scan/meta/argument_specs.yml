---
# Machine-readable counterpart to docs/variable-reference.md: this is what
# `ansible-doc -t role sameeralam3127.linux_vitals.vitals_scan` renders, and
# what validates an operator's overrides at role entry rather than deep inside
# a Jinja expression.
#
# Nothing here is `required`. Every variable has a working default and the role
# must stay runnable with no configuration at all.
argument_specs:
  main:
    short_description: Read-only Linux host discovery, posture checks, and findings
    description:
      - Gathers facts, journal and log posture, kernel and bootloader state,
        boot-partition health, security controls, and failed-login data.
      - Builds one C(linux_vitals_result) fact per host with a C(final_status)
        of C(Pass) or C(Fail) and a list of C(findings).
      - Never changes anything on the managed host.
    author:
      - Sameer Alam
    options:
      linux_vitals_log_window:
        type: str
        default: "30 minutes ago"
        description:
          - How far back C(journalctl) is scanned for entries at
            C(linux_vitals_log_priority) or worse, which feed the
            C(log_errors) count.
          - Passed to C(journalctl --since) as a single argument, so any value
            that option accepts works.
      linux_vitals_audit_log_window:
        type: str
        default: "7 days ago"
        description:
          - How far back C(journalctl) is scanned for kernel, grub, dracut, and
            initramfs failure lines.
          - Longer than C(linux_vitals_log_window) because a failed kernel
            install is worth catching well after the fact.
          - The lines are matched on the managed host, so the whole window is
            read there, but only matching lines reach the control node.
      linux_vitals_log_priority:
        type: str
        default: err
        description:
          - The journal priority that C(log_errors) counts, passed to
            C(journalctl --priority) on the managed host.
          - A single level means that level or worse, so the default C(err)
            counts C(err), C(crit), C(alert) and C(emerg) entries. A range
            such as C(warning..emerg), or a number from C(0) to C(7), also
            works.
          - A value C(journalctl) rejects makes C(log_errors) C(unknown), with
            journalctl's error as the reason.
      linux_vitals_log_max_lines:
        type: int
        default: 2000
        description:
          - The most journal lines either scan returns per host. The error scan
            keeps the newest entries in C(linux_vitals_log_window), and the
            kernel-failure scan keeps the newest matching lines in
            C(linux_vitals_audit_log_window).
          - Bounds what each host sends to the control node, however large its
            journal is. A count that reaches the cap means at least that many.
          - Must be at least C(1). A smaller value makes both journal findings
            C(unknown) rather than reporting a scan that looked at nothing as
            clean.
      linux_vitals_ram_warning_threshold:
        type: int
        default: 80
        description:
          - RAM used percentage at or above which C(ram_status) becomes
            C(Warning).
          - A warning does not fail the host on its own.
      linux_vitals_ram_critical_threshold:
        type: int
        default: 95
        description:
          - RAM used percentage at or above which C(ram_status) becomes
            C(Critical), which produces a finding and fails the host.
      linux_vitals_boot_warning_threshold:
        type: int
        default: 20
        description:
          - Boot partition free percentage below which C(boot_space_status)
            becomes C(Low), which produces a finding and fails the host.
          - Note this is a I(free) percentage, unlike the RAM thresholds, which
            are I(used) percentages.
      linux_vitals_load_warning_threshold:
        type: float
        default: 1.5
        description:
          - 5-minute load average per online CPU at or above which
            C(cpu_load_high) is raised as a C(warning).
          - 1.0 means every CPU was busy on average over the five minutes, which
            a healthy batch host reaches routinely; above it, tasks are queueing.
      linux_vitals_load_critical_threshold:
        type: float
        default: 3.0
        description:
          - 5-minute load average per online CPU at or above which
            C(cpu_load_high) is raised as C(critical).
      linux_vitals_psi_warning_threshold:
        type: float
        default: 25
        description:
          - Pressure stall percentage (PSI C(some avg60)) at or above which
            C(pressure_stall_high) is raised as a C(warning) for that resource
            (CPU, memory or I/O).
          - It is the share of the last 60 seconds in which at least one task
            was stalled waiting for the resource. PSI needs kernel 4.20 or later
            with PSI enabled; elsewhere the report says it is unsupported and
            no PSI finding is raised.
      linux_vitals_psi_critical_threshold:
        type: float
        default: 50
        description:
          - Pressure stall percentage (PSI C(some avg60)) at or above which
            C(pressure_stall_high) is raised as C(critical).
      linux_vitals_swap_rate_warning_threshold:
        type: int
        default: 100
        description:
          - Pages swapped in plus out per second, over the
            C(linux_vitals_swap_sample_seconds) sample, at or above which
            C(swap_paging_high) is raised as a C(warning).
      linux_vitals_swap_rate_critical_threshold:
        type: int
        default: 1000
        description:
          - Pages swapped in plus out per second at or above which
            C(swap_paging_high) is raised as C(critical).
      linux_vitals_swap_sample_seconds:
        type: int
        default: 2
        description:
          - Seconds between the two C(/proc/vmstat) reads the swap rate is
            measured over. Every host waits this long once per scan.
          - C(0) skips the measurement, and with it C(swap_paging_high); values
            above 60 are treated as 60.
      linux_vitals_disk_warning_threshold:
        type: int
        default: 80
        description:
          - Filesystem used percentage at or above which C(filesystem_space_low)
            is raised as a C(warning) for that mount.
      linux_vitals_disk_critical_threshold:
        type: int
        default: 95
        description:
          - Filesystem used percentage at or above which C(filesystem_space_low)
            is raised as C(critical).
      linux_vitals_disk_inode_warning_threshold:
        type: int
        default: 80
        description:
          - Inode used percentage at or above which C(filesystem_inodes_low)
            is raised as a C(warning) for that mount. Inode exhaustion can
            fail writes with plenty of free bytes still showing, so this is
            checked independently of C(linux_vitals_disk_warning_threshold).
      linux_vitals_disk_inode_critical_threshold:
        type: int
        default: 95
        description:
          - Inode used percentage at or above which C(filesystem_inodes_low)
            is raised as C(critical).
      linux_vitals_disk_exclude_fstypes:
        type: list
        elements: str
        default:
          - tmpfs
          - devtmpfs
          - proc
          - sysfs
          - squashfs
          - overlay
          - cgroup
          - cgroup2
          - devpts
          - mqueue
          - debugfs
          - tracefs
          - pstore
          - bpf
          - securityfs
          - configfs
          - fusectl
          - binfmt_misc
          - autofs
          - nfs
          - nfs3
          - nfs4
          - cifs
        description:
          - Filesystem types excluded by default from capacity and inode
            checks -- pseudo-filesystems, snap loopbacks (C(squashfs)) and
            network filesystems. A mount of one of these types is still
            checked when it is named in C(linux_vitals_disk_include_mounts).
      linux_vitals_disk_include_mounts:
        type: list
        elements: str
        default: []
        description:
          - Mount points checked even though their filesystem type is in
            C(linux_vitals_disk_exclude_fstypes).
      linux_vitals_disk_exclude_mounts:
        type: list
        elements: str
        default: []
        description:
          - Mount points never checked, regardless of filesystem type. Wins
            over C(linux_vitals_disk_include_mounts) for a mount named in
            both.
      linux_vitals_disk_expected_readonly_mounts:
        type: list
        elements: str
        default: []
        description:
          - Mount points allowed to be read-only without raising
            C(filesystem_read_only). An unexpectedly read-only filesystem is
            usually a remount after an I/O error, so this is empty by
            default; name a mount here only when it is deliberately
            read-only, such as a locked-down read-only root image.
      linux_vitals_severity_order:
        type: list
        elements: str
        default:
          - info
          - warning
          - critical
        description:
          - The severity ladder, least to most severe.
          - Used to rank a host's findings into one C(severity), and to decide
            which findings clear C(linux_vitals_fail_on_severity).
          - Changing the order, rather than extending it, will confuse both.
      linux_vitals_finding_severities:
        type: dict
        # Repeated from defaults/main.yml rather than referenced, because
        # `ansible-doc` renders this file on its own. test_argument_specs.py
        # asserts the two stay identical.
        default:
          ram_critical: critical
          journald_inactive: critical
          service_manual_followup: critical
          boot_space_low: warning
          reboot_required: warning
          kernel_not_latest: warning
          bootloader_mismatch: warning
          kernel_install_failures: warning
          sssd_inactive: warning
          time_sync_absent: warning
          time_sync_inactive: warning
          selinux_disabled: warning
          apparmor_disabled: warning
          cpu_load_high: warning
          pressure_stall_high: warning
          swap_paging_high: warning
          filesystem_space_low: warning
          filesystem_inodes_low: warning
          filesystem_read_only: critical
          filesystem_unavailable: warning
          filesystem_probe_degraded: warning
          log_errors: info
          failed_logins: info
        description:
          - Maps each finding id to C(info), C(warning), or C(critical).
          - Prefer C(linux_vitals_finding_severity_overrides) for retuning a
            single finding; replacing this whole map means findings added in a
            later release have no entry and fall back to C(warning).
      linux_vitals_finding_severity_overrides:
        type: dict
        default: {}
        description:
          - Per-finding severity overrides, merged over
            C(linux_vitals_finding_severities).
          - 'Example: C({apparmor_disabled: info, reboot_required: critical}).'
      linux_vitals_fail_on_severity:
        type: str
        default: info
        choices:
          - info
          - warning
          - critical
        description:
          - The severity at which a finding makes a host C(Fail).
          - The default C(info) means any finding fails the host, which is how
            every release before severity existed behaved.
          - Raising it to C(warning) or C(critical) is what turns severity into
            triage - every finding is still reported, but only ones at or above
            this level count against the host. This changes C(final_status) and
            therefore the fleet health score.
