---
# Probe: the bootloader's default entry and the kernel it boots. Parsed in
# extended_facts.yml, compared with the latest kernel in bootloader_facts.yml.
- name: Collect bootloader default kernel information
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          sanitize_kernel() {
            kernel_value="$1"
            # An entry can point at a symlink (Debian's /vmlinuz) or at a path
            # that is relative to a separate /boot partition -- resolve both
            # before reducing the path to a bare kernel version.
            for candidate in "$kernel_value" "/boot$kernel_value"; do
              if [ -L "$candidate" ]; then
                resolved_link="$(readlink -f "$candidate" 2>/dev/null || true)"
                if [ -n "$resolved_link" ]; then
                  kernel_value="$resolved_link"
                  break
                fi
              fi
            done
            kernel_value="${kernel_value##*/}"
            kernel_value="${kernel_value%.efi}"
            kernel_value="${kernel_value#vmlinuz-}"
            kernel_value="${kernel_value#vmlinux-}"
            kernel_value="${kernel_value#linux-}"
            kernel_value="${kernel_value#kernel-}"
            printf '%s' "$kernel_value"
          }

          bls_entry_dirs="/boot/loader/entries /boot/efi/loader/entries /efi/loader/entries"

          # RHEL 8+/Fedora and SUSE with BLS keep boot entries as drop-in files
          # rather than menuentry blocks, so grub.cfg parsing never sees them.
          resolve_kernel_from_bls_id() {
            entry_id="$1"
            [ -n "$entry_id" ] || return 0
            for entries_dir in $bls_entry_dirs; do
              [ -d "$entries_dir" ] || continue
              for entry_conf in "$entries_dir/$entry_id" "$entries_dir/$entry_id.conf"; do
                if [ -f "$entry_conf" ]; then
                  kernel_from_bls_conf "$entry_conf"
                  return 0
                fi
              done
            done
          }

          resolve_kernel_from_bls_title() {
            entry_title="$1"
            [ -n "$entry_title" ] || return 0
            for entries_dir in $bls_entry_dirs; do
              [ -d "$entries_dir" ] || continue
              for entry_conf in "$entries_dir"/*.conf; do
                [ -f "$entry_conf" ] || continue
                conf_title="$(awk '$1 == "title" { $1 = ""; sub(/^[ \t]+/, ""); print; exit }' "$entry_conf")"
                if [ "$conf_title" = "$entry_title" ]; then
                  kernel_from_bls_conf "$entry_conf"
                  return 0
                fi
              done
            done
          }

          # Type 1 entries carry a `linux` line; unified kernel image (type 2)
          # entries carry an `efi` line pointing at the bundled image instead.
          kernel_from_bls_conf() {
            entry_conf="$1"
            kernel_line="$(awk '$1 == "linux" { print $2; exit }' "$entry_conf")"
            if [ -z "$kernel_line" ]; then
              kernel_line="$(awk '$1 == "efi" { print $2; exit }' "$entry_conf")"
            fi
            printf '%s' "$kernel_line"
          }

          resolve_kernel_from_any_entry() {
            entry_reference="$1"
            resolved_from_entry="$(resolve_kernel_from_bls_id "$entry_reference")"
            if [ -z "$resolved_from_entry" ]; then
              resolved_from_entry="$(resolve_kernel_from_bls_title "$entry_reference")"
            fi
            if [ -z "$resolved_from_entry" ] && [ -n "$grub_cfg" ]; then
              resolved_from_entry="$(resolve_kernel_from_grubcfg "$entry_reference" "$grub_cfg")"
            fi
            printf '%s' "$resolved_from_entry"
          }

          # Portable POSIX sh state machine (no gawk-only 3-arg match()) so this
          # works under mawk/dash/BusyBox targets, not just gawk-equipped hosts.
          resolve_kernel_from_grubcfg() {
            entry_name="$1"
            config_path="$2"
            [ -n "$entry_name" ] || return 0
            [ -f "$config_path" ] || return 0
            in_entry=0
            while IFS= read -r line; do
              case "$line" in
                menuentry\ *)
                  in_entry=0
                  rest="${line#menuentry }"
                  case "$rest" in
                    \'*)
                      title="${rest#\'}"
                      title="${title%%\'*}"
                      ;;
                    \"*)
                      title="${rest#\"}"
                      title="${title%%\"*}"
                      ;;
                    *)
                      title=""
                      ;;
                  esac
                  if [ "$title" = "$entry_name" ]; then
                    in_entry=1
                  fi
                  ;;
                *)
                  if [ "$in_entry" -eq 1 ]; then
                    set -f
                    set -- $line
                    set +f
                    if [ "$1" = "linux" ] || [ "$1" = "linuxefi" ] || [ "$1" = "linux16" ]; then
                      printf '%s\n' "$2"
                      return 0
                    fi
                  fi
                  ;;
              esac
            done < "$config_path"
          }

          resolve_kernel_from_grubcfg_by_index() {
            target_index="$1"
            config_path="$2"
            [ -f "$config_path" ] || return 0
            current_index=-1
            in_entry=0
            while IFS= read -r line; do
              case "$line" in
                menuentry\ *)
                  current_index=$((current_index + 1))
                  in_entry=0
                  if [ "$current_index" -eq "$target_index" ]; then
                    in_entry=1
                  fi
                  ;;
                *)
                  if [ "$in_entry" -eq 1 ]; then
                    set -f
                    set -- $line
                    set +f
                    if [ "$1" = "linux" ] || [ "$1" = "linuxefi" ] || [ "$1" = "linux16" ]; then
                      printf '%s\n' "$2"
                      return 0
                    fi
                  fi
                  ;;
              esac
            done < "$config_path"
          }

          print_result() {
            printf 'supported=%s\n' "$1"
            printf 'source=%s\n' "$2"
            printf 'default_entry=%s\n' "$3"
            printf 'default_kernel=%s\n' "$4"
            printf 'status=%s\n' "$5"
          }

          grub_cfg=""
          for candidate in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg /efi/EFI/*/grub.cfg; do
            if [ -f "$candidate" ]; then
              grub_cfg="$candidate"
              break
            fi
          done

          if command -v grubby >/dev/null 2>&1; then
            default_kernel_path="$(grubby --default-kernel 2>/dev/null || true)"
            if [ -n "$default_kernel_path" ]; then
              print_result "true" "grubby" "$default_kernel_path" "$(sanitize_kernel "$default_kernel_path")" "resolved"
              exit 0
            fi
          fi

          grub_editenv_cmd=""
          for candidate_cmd in grub2-editenv grub-editenv; do
            if command -v "$candidate_cmd" >/dev/null 2>&1; then
              grub_editenv_cmd="$candidate_cmd"
              break
            fi
          done

          grub_env=""
          for candidate in /boot/grub2/grubenv /boot/grub/grubenv /boot/efi/EFI/*/grubenv /efi/EFI/*/grubenv; do
            if [ -f "$candidate" ]; then
              grub_env="$candidate"
              break
            fi
          done

          if [ -n "$grub_editenv_cmd" ] && [ -n "$grub_env" ]; then
            saved_entry="$("$grub_editenv_cmd" "$grub_env" list 2>/dev/null | sed -n 's/^saved_entry=//p' | head -n 1)"
            if [ -n "$saved_entry" ]; then
              resolved_kernel=""
              resolved_path="$(resolve_kernel_from_any_entry "$saved_entry")"
              if [ -n "$resolved_path" ]; then
                resolved_kernel="$(sanitize_kernel "$resolved_path")"
              else
                case "$saved_entry" in
                  *vmlinuz*|*linux-*)
                    resolved_kernel="$(sanitize_kernel "$saved_entry")"
                    ;;
                esac
              fi
              result_status="entry-only"
              if [ -n "$resolved_kernel" ]; then
                result_status="resolved"
              fi
              print_result "true" "grubenv" "$saved_entry" "$resolved_kernel" "$result_status"
              exit 0
            fi
          fi

          if [ -f /etc/default/grub ]; then
            grub_default_raw="$(sed -n 's/^GRUB_DEFAULT=//p' /etc/default/grub | head -n 1 | tr -d '"' | tr -d "'")"
            if [ -n "$grub_default_raw" ] && [ "$grub_default_raw" != "saved" ]; then
              resolved_kernel=""
              case "$grub_default_raw" in
                ''|*[!0-9]*)
                  resolved_path="$(resolve_kernel_from_any_entry "$grub_default_raw")"
                  if [ -n "$resolved_path" ]; then
                    resolved_kernel="$(sanitize_kernel "$resolved_path")"
                  else
                    case "$grub_default_raw" in
                      *vmlinuz*|*linux-*)
                        resolved_kernel="$(sanitize_kernel "$grub_default_raw")"
                        ;;
                    esac
                  fi
                  ;;
                *)
                  if [ -n "$grub_cfg" ]; then
                    resolved_path="$(resolve_kernel_from_grubcfg_by_index "$grub_default_raw" "$grub_cfg")"
                    if [ -n "$resolved_path" ]; then
                      resolved_kernel="$(sanitize_kernel "$resolved_path")"
                    fi
                  fi
                  ;;
              esac
              result_status="entry-only"
              if [ -n "$resolved_kernel" ]; then
                result_status="resolved"
              fi
              print_result "true" "grub_default" "$grub_default_raw" "$resolved_kernel" "$result_status"
              exit 0
            fi
          fi

          # systemd-boot: no grub anywhere, the default lives in loader.conf and
          # may be a glob (systemd-boot then picks the version-highest match).
          for loader_conf in /boot/loader/loader.conf /boot/efi/loader/loader.conf /efi/loader/loader.conf; do
            [ -f "$loader_conf" ] || continue
            entries_dir="${loader_conf%/loader.conf}/entries"
            default_pattern="$(awk '$1 == "default" { print $2; exit }' "$loader_conf")"
            if [ -z "$default_pattern" ]; then
              print_result "true" "systemd-boot" "" "" "entry-only"
              exit 0
            fi
            matched_entry=""
            if [ -d "$entries_dir" ]; then
              matched_entry="$(
                for entry_conf in "$entries_dir"/$default_pattern "$entries_dir"/$default_pattern.conf; do
                  [ -f "$entry_conf" ] && printf '%s\n' "$entry_conf"
                done | sort -V -u | tail -n 1
              )"
            fi
            resolved_kernel=""
            if [ -n "$matched_entry" ]; then
              resolved_path="$(kernel_from_bls_conf "$matched_entry")"
              if [ -n "$resolved_path" ]; then
                resolved_kernel="$(sanitize_kernel "$resolved_path")"
              fi
            fi
            result_status="entry-only"
            if [ -n "$resolved_kernel" ]; then
              result_status="resolved"
            fi
            print_result "true" "systemd-boot" "$default_pattern" "$resolved_kernel" "$result_status"
            exit 0
          done

          # Nothing above could resolve the default entry. Tell "no bootloader
          # configuration to read" apart from "configuration present but
          # unreadable" (#150): a container, EFI-stub or cloud boot has no boot
          # environment here at all and stays unavailable with no finding,
          # while a GRUB host whose tools could not read it -- most often
          # grubby and grub2-editenv failing without root, see
          # docs/threat-model.md -- must not be reported the same way. In the
          # second case an extra reason= line carries the tools' stderr up to
          # extended_facts.yml, and result.yml raises bootloader_mismatch as
          # an unknown finding with that reason.
          config_present=""
          for present in "$grub_cfg" "$grub_env" \
              /boot/loader/entries /boot/efi/loader/entries /efi/loader/entries; do
            if [ -e "$present" ]; then
              config_present="true"
              break
            fi
          done

          if [ -z "$config_present" ]; then
            print_result "false" "unavailable" "" "" "unavailable"
            exit 0
          fi

          reason=""
          add_reason() {
            if [ -n "$1" ]; then
              reason="${reason:+$reason; }$1"
            fi
          }
          if command -v grubby >/dev/null 2>&1; then
            grubby_rc=0
            grubby_err="$(grubby --default-kernel 2>&1 1>/dev/null)" || grubby_rc=$?
            if [ "$grubby_rc" -ne 0 ]; then
              add_reason "grubby exited $grubby_rc: $grubby_err"
            else
              add_reason "grubby reported no default kernel"
            fi
          else
            add_reason "grubby is not installed"
          fi

          if [ -z "$grub_editenv_cmd" ]; then
            add_reason "grub2-editenv/grub-editenv is not installed"
          elif [ -z "$grub_env" ]; then
            add_reason "no grubenv file was found"
          else
            env_rc=0
            env_err="$("$grub_editenv_cmd" "$grub_env" list 2>&1 1>/dev/null)" || env_rc=$?
            if [ "$env_rc" -ne 0 ]; then
              add_reason "grub2-editenv exited $env_rc: $env_err"
            else
              add_reason "grub2-editenv found no saved_entry"
            fi
          fi

          # The reason has to stay on one line: extended_facts.yml reads it
          # back with a single-key regex.
          reason="$(printf '%s' "$reason" | tr '\n\r' '  ' | sed 's/[[:space:]]*$//')"
          print_result "false" "unavailable" "" "" "unavailable"
          printf 'reason=%s\n' "$reason"
  register: linux_vitals_bootloader_default_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - kernel
