---
# Probe: the bootloader's default entry and the kernel it boots. Parsed in
# extended_facts.yml, compared with the latest kernel in bootloader_facts.yml.
- name: Collect bootloader default kernel information
  # The script is files/bootloader_probe.sh, read on the controller and passed
  # to `sh -c` exactly as it was when it sat inline here. Deliberately not
  # ansible.builtin.script: that transfers and executes a file on the managed
  # host, which needs an exec bit and a non-noexec temp directory. Reading it
  # here changes where the text comes from and nothing about how it runs.
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "{{ lookup('ansible.builtin.file', 'bootloader_probe.sh') }}"
  register: linux_vitals_bootloader_default_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - kernel
