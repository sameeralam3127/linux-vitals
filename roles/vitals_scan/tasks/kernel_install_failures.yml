---
# Probe: kernel, bootloader and initramfs failures in the journal, for the
# kernel_install_failures finding. journal_facts.yml evaluates what it
# registers.
- name: Collect kernel install failures from logs
  # Filtered on the host (#23), so only matching lines cross to the control
  # node, and capped at the newest linux_vitals_log_max_lines of them. The
  # pattern is the one this check has always matched, unchanged. It runs over
  # the whole formatted line, identifier included, which is why this is grep
  # and not `journalctl --grep`: that matches MESSAGE alone, and needs a
  # journalctl built with PCRE2.
  #
  # bash, for pipefail. Without it the pipeline's status is tail's, and a
  # journalctl that could not read the journal would look like a clean read.
  # grep exits 1 when nothing matches, which is a clean read, so only a
  # status above 1 is passed on. Every templated value is a positional
  # parameter, never part of the script text.
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - |
        set -o pipefail
        journalctl --system --since "$1" --no-pager --output=short-iso \
          | { grep -a -E -i -e "$2"; status=$?; [ "$status" -le 1 ] || exit "$status"; } \
          | tail -n "$3"
      - linux-vitals-audit-scan
      - "{{ linux_vitals_audit_log_window }}"
      - (kernel|grub|dracut|initramfs).*(fail|error)
      - "{{ linux_vitals_log_max_lines | int }}"
  environment:
    LC_ALL: C
  register: linux_vitals_audit_journalctl
  changed_when: false
  failed_when: false
  when: ansible_facts['service_mgr'] == "systemd"
  tags:
    - discovery
    - kernel
