---
# Parse every probe's output into the linux_vitals_* facts result.yml reads.
# Runs after memory.yml and after every probe. reboot_facts.yml and
# bootloader_facts.yml read facts this task sets, so they run after it.
- name: Finalize extended discovery facts
  ansible.builtin.set_fact:
    linux_vitals_ram_status: >-
      {{
        'Critical'
        if linux_vitals_ram_used_pct | float
        >= linux_vitals_ram_critical_threshold | float
        else 'Warning'
        if linux_vitals_ram_used_pct | float
        >= linux_vitals_ram_warning_threshold | float
        else 'OK'
      }}
    linux_vitals_virtualization_type: "{{ ansible_facts['virtualization_type'] | default('unknown') }}"
    linux_vitals_platform_type: >-
      {{
        'Virtual Machine'
        if ansible_facts['virtualization_role'] | default('NA') == 'guest'
        else 'Physical'
        if ansible_facts['virtualization_type'] | default('') in ['NA', '', 'none']
        else 'Hypervisor'
      }}
    linux_vitals_uptime_seconds: "{{ ansible_facts['uptime_seconds'] | default(0) | int }}"
    linux_vitals_uptime_readable: >-
      {{
        (
          (ansible_facts['uptime_seconds'] | default(0) | int // 86400) | string
        ) ~ 'd '
        ~ (
          ((ansible_facts['uptime_seconds'] | default(0) | int % 86400) // 3600) | string
        ) ~ 'h '
        ~ (
          (((ansible_facts['uptime_seconds'] | default(0) | int % 3600) // 60)) | string
        ) ~ 'm'
      }}
    linux_vitals_running_kernel: "{{ ansible_facts['kernel'] | default('unknown') }}"
    linux_vitals_latest_installed_kernel: >-
      {{
        linux_vitals_latest_kernel_cmd.stdout
        | default('')
        | regex_findall('(?m)^latest=(.*)$')
        | first
        | default('', true)
        | trim
        | default('unknown', true)
      }}
    linux_vitals_latest_kernel_updated_at: >-
      {{
        linux_vitals_latest_kernel_cmd.stdout
        | default('')
        | regex_findall('(?m)^updated_at=(.*)$')
        | first
        | default('', true)
        | trim
        | default('unknown', true)
      }}
    linux_vitals_latest_kernel_selected: >-
      {{
        (
          linux_vitals_latest_kernel_cmd.stdout
          | default('')
          | regex_findall('(?m)^latest=(.*)$')
          | first
          | default('')
          | trim
        ) == (
          ansible_facts['kernel'] | default('') | trim
        )
      }}
    linux_vitals_bootloader_supported: >-
      {{
        (
          linux_vitals_bootloader_default_cmd.stdout
          | regex_findall('(?m)^supported=(.*)$')
          | first
          | default('false')
          | trim
        ) == 'true'
      }}
    linux_vitals_bootloader_default_source: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^source=(.*)$')
        | first
        | default('unavailable')
        | trim
      }}
    linux_vitals_bootloader_default_entry: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^default_entry=(.*)$')
        | first
        | default('')
        | trim
      }}
    linux_vitals_bootloader_default_kernel: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^default_kernel=(.*)$')
        | first
        | default('')
        | trim
      }}
    linux_vitals_bootloader_default_status: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^status=(.*)$')
        | first
        | default('unavailable')
        | trim
      }}
    linux_vitals_reboot_probe_output: >-
      {{
        linux_vitals_debian_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'Debian'
        else linux_vitals_redhat_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'RedHat'
        else linux_vitals_suse_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'Suse'
        else ''
      }}
    linux_vitals_selinux_status: >-
      {{
        linux_vitals_selinux_cmd.stdout
        | default('', true)
        | trim
        | default('not-installed', true)
      }}
    # aa-status(8): 0 enabled; 1 not enabled; 2 enabled with no policy
    # loaded; 3 AppArmor's control files are absent (not in the kernel).
    # All but 0 confine nothing, so all read as disabled. 127 is the probe's
    # own "not installed" (security.yml). Anything else -- 4 is insufficient
    # privileges -- means the state could not be read.
    linux_vitals_apparmor_status: >-
      {{
        'enabled' if apparmor_rc | int == 0
        else 'disabled' if apparmor_rc | int in [1, 2, 3]
        else 'not-installed' if apparmor_rc | int == 127
        else 'unknown'
      }}
    linux_vitals_apparmor_check_reason: "{{ apparmor_reason | trim }}"
    linux_vitals_failed_login_check_reason: "{{ lastb_reason | trim }}"
    linux_vitals_failed_login_attempts: >-
      {{
        lastb_lines
        if lastb_rc | int == 0
        else []
      }}
    # Never "No failed login attempts found" for a check that did not run:
    # the dashboard would present an unchecked control as a clean one.
    linux_vitals_last_failed_login: >-
      {{
        lastb_lines | first | default('No failed login attempts found')
        if lastb_rc | int == 0
        else 'Not checked: ' ~ lastb_reason | trim
      }}
    linux_vitals_last_reboot: >-
      {{
        linux_vitals_last_reboot_cmd.stdout
        | default('Unknown')
        | regex_replace('^\s*system boot\s+', '')
        | trim
        | default('Unknown', true)
      }}
    linux_vitals_rescue_image_available: >-
      {{
        linux_vitals_rescue_image_cmd.stdout | default('') | trim | length > 0
      }}
    linux_vitals_rescue_image_paths: "{{ linux_vitals_rescue_image_cmd.stdout_lines | default([]) }}"
  vars:
    # Cast again at each use: ansible-core 2.16 stores these as strings.
    apparmor_rc: "{{ linux_vitals_apparmor_cmd.rc | default(-1) }}"
    lastb_rc: "{{ linux_vitals_failed_login_attempts_cmd.rc | default(-1) }}"
    lastb_lines: >-
      {{
        linux_vitals_failed_login_attempts_cmd.stdout_lines
        | default([])
        | reject('equalto', '')
        | reject('match', '^btmp begins ')
        | list
      }}
    # In vars rather than set_fact keys, because one key of a set_fact cannot
    # read another set in the same task.
    apparmor_reason: >-
      {{
        '' if apparmor_rc | int in [0, 1, 2, 3]
        else 'aa-status is not installed, so whether AppArmor is enabled could not be read'
        if apparmor_rc | int == 127
        else 'aa-status lacked the privileges to read the AppArmor control files'
        if apparmor_rc | int == 4
        else 'aa-status exited ' ~ apparmor_rc ~ ': '
             ~ (linux_vitals_apparmor_cmd.stderr | default(linux_vitals_apparmor_cmd.msg | default(''), true) | trim
                or 'no error output')
      }}
    # Exit codes 3-5 are the probe's own (login_records.yml). Any other
    # non-zero exit is lastb failing, and its stderr says why.
    lastb_reason: >-
      {{
        '' if lastb_rc | int == 0
        else 'lastb is not installed' if lastb_rc | int == 3
        else '/var/log/btmp does not exist, so failed logins are not being recorded' if lastb_rc | int == 4
        else 'reading /var/log/btmp was denied; this check needs become' if lastb_rc | int == 5
        else 'lastb exited ' ~ lastb_rc ~ ': '
             ~ (linux_vitals_failed_login_attempts_cmd.stderr | default(linux_vitals_failed_login_attempts_cmd.msg | default(''), true) | trim
                or 'no error output')
      }}
  tags:
    - discovery
    - kernel
    - security
    - boot
