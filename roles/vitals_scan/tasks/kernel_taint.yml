---
# Probe: the kernel taint flags (#36) -- a single always-readable file, no
# escalation needed, unlike `sshd -T` in ssh_hardening.yml (see
# docs/threat-model.md). A non-zero value explains a lot of otherwise
# mysterious behaviour.
# kernel_taint_facts.yml decodes the bitmask.
- name: Collect kernel taint flags
  ansible.builtin.command:
    argv:
      - cat
      - /proc/sys/kernel/tainted
  register: linux_vitals_kernel_taint_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - security
