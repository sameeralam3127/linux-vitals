---
# Platform-state findings, split out of result.yml to stay inside that file's
# review-size budget (#27, tests/test_scan_task_size.py).
#
# One concern: what the host booted and what it is running -- whether a reboot
# is pending, whether the running kernel is the newest installed, whether the
# default boot entry selects it, whether /boot has room, whether the kernel's
# own install logs are clean, recent failed logins, and the state of mandatory
# access control.
#
# Four of these raise `unknown` rather than a verdict when their probe could
# not answer (#150): a latest-kernel probe that saw nothing, a boot
# environment that exists but could not be read, a getenforce that is missing
# or failed, and journal-backed checks on an unreadable journal. That is the
# finding contract (#62) -- a check that could not run says so, and never
# reads as clean.
#
# result.yml extends this list in the exact position these findings used to be
# appended, so the order the golden fixtures pin does not move.
- name: Build the platform-state findings
  ansible.builtin.set_fact:
    linux_vitals_platform_findings: >-
      {%- set findings = [] -%}
      {%- if linux_vitals_reboot_required -%}
      {%- set _ = findings.append({'id': 'reboot_required', 'message': 'System reboot is required'}) -%}
      {%- endif -%}
      {#- The latest-kernel probe (#150): a failed or empty probe (an unseen
          /lib/modules) cannot support a verdict, on the running kernel or on
          the reboot fallback, so its finding raises as `unknown` with a
          reason rather than as a clean failure to be current. -#}
      {%- if not linux_vitals_latest_kernel_probe_answered | default(true) -%}
      {%- set _ = findings.append({
        'id': 'kernel_not_latest', 'message': 'Latest installed kernel could not be determined',
        'status': 'unknown',
        'reason': 'the latest-kernel probe produced no answer: /lib/modules is unreadable or empty on this host'}) -%}
      {%- elif not linux_vitals_latest_kernel_selected -%}
      {%- set _ = findings.append({'id': 'kernel_not_latest', 'message': 'Latest installed kernel is not currently running'}) -%}
      {%- endif -%}
      {#- The bootloader probe distinguishes (#150) no boot configuration at
          all (a container, EFI-stub or cloud boot: nothing to report, and a
          container must stay clean) from a boot environment that is present
          but unreadable -- most often grubby and grub2-editenv failing
          without root. The second raises bootloader_mismatch as `unknown`
          with the tools' stderr as the reason. The plain-fail mismatch is
          also gated on the latest-kernel probe having answered: a mismatch
          cannot be claimed against a latest kernel nobody could determine
          -- kernel_not_latest already carries that as `unknown`. -#}
      {%- if linux_vitals_bootloader_default_status == 'resolved'
              and linux_vitals_latest_kernel_probe_answered | default(true)
              and not linux_vitals_bootloader_default_matches_latest -%}
      {%- set _ = findings.append({'id': 'bootloader_mismatch', 'message': 'Default boot entry does not select the latest installed kernel'}) -%}
      {%- elif linux_vitals_bootloader_default_status == 'unavailable'
               and linux_vitals_bootloader_probe_reason | default('', true) | trim | length > 0 -%}
      {%- set _ = findings.append({
        'id': 'bootloader_mismatch', 'message': 'Default boot entry could not be read',
        'status': 'unknown', 'reason': linux_vitals_bootloader_probe_reason}) -%}
      {%- endif -%}
      {%- if linux_vitals_boot_space_status == 'Low' -%}
      {%- set _ = findings.append({'id': 'boot_space_low', 'message': 'Boot partition free space is low'}) -%}
      {%- endif -%}
      {%- if (linux_vitals_journal_checks | default({})).get('kernel_install_failures', '') -%}
      {%- set _ = findings.append({
        'id': 'kernel_install_failures', 'message': 'Kernel installation logs could not be inspected',
        'status': 'unknown', 'reason': linux_vitals_journal_checks['kernel_install_failures']}) -%}
      {%- elif linux_vitals_kernel_install_failures | int > 0 -%}
      {%- set _ = findings.append({'id': 'kernel_install_failures', 'message': 'Kernel installation or bootloader related failures found in logs'}) -%}
      {%- endif -%}
      {#- A failed-login check that could not run is unknown, never a clean
          host (#39): an unprivileged run, no lastb, or no btmp at all. -#}
      {%- if linux_vitals_failed_login_check_reason | default('') -%}
      {%- set _ = findings.append({
        'id': 'failed_logins', 'message': 'Failed login attempts could not be inspected',
        'status': 'unknown', 'reason': linux_vitals_failed_login_check_reason}) -%}
      {%- elif linux_vitals_failed_login_attempts | length > 0 -%}
      {%- set _ = findings.append({'id': 'failed_logins', 'message': 'Recent failed login attempts detected'}) -%}
      {%- endif -%}
      {#- SELinux (#150): on RedHat-family hosts a missing or failing
          getenforce means nobody looked, so the finding raises as `unknown`
          with a reason, the same thing #39 asks for a missing aa-status on
          Debian-family hosts. A getenforce that ran and said `Disabled` is
          still a plain failure: the check ran and found the control off. -#}
      {%- if ansible_facts['os_family'] == 'RedHat'
        and not linux_vitals_selinux_probe_ok | default(true) -%}
      {%- set _ = findings.append({
        'id': 'selinux_disabled', 'message': 'SELinux status could not be read',
        'status': 'unknown',
        'reason': 'getenforce is missing or failed to report a mode on this host'}) -%}
      {%- elif linux_vitals_selinux_status not in ['Enforcing', 'Permissive'] and ansible_facts['os_family'] == 'RedHat' -%}
      {%- set _ = findings.append({'id': 'selinux_disabled', 'message': 'SELinux is disabled or unavailable'}) -%}
      {%- endif -%}
      {#- A missing or unreadable aa-status says nothing about AppArmor, so
          it is unknown rather than disabled (#39). -#}
      {%- if ansible_facts['os_family'] == 'Debian' and linux_vitals_apparmor_check_reason | default('') -%}
      {%- set _ = findings.append({
        'id': 'apparmor_disabled', 'message': 'AppArmor status could not be determined',
        'status': 'unknown', 'reason': linux_vitals_apparmor_check_reason}) -%}
      {%- elif ansible_facts['os_family'] == 'Debian' and linux_vitals_apparmor_status != 'enabled' -%}
      {%- set _ = findings.append({'id': 'apparmor_disabled', 'message': 'AppArmor is disabled'}) -%}
      {%- endif -%}
      {{ findings }}
  tags:
    - result
    - reporting
