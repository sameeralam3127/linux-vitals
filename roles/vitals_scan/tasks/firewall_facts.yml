---
# Evaluate the firewall probe (firewall.yml) (#36) into the facts result.yml
# raises firewall_inactive from.
- name: Parse the firewall probe
  ansible.builtin.set_fact:
    linux_vitals_firewall_supported: >-
      {{
        (
          linux_vitals_firewall_cmd.stdout
          | default('', true)
          | regex_findall('(?m)^supported=(.*)$')
          | first
          | default('false', true)
          | trim
        ) == 'true'
      }}
    linux_vitals_firewall_active: >-
      {{
        (
          linux_vitals_firewall_cmd.stdout
          | default('', true)
          | regex_findall('(?m)^active=(.*)$')
          | first
          | default('false', true)
          | trim
        ) == 'true'
      }}
    linux_vitals_firewall_source: >-
      {{
        linux_vitals_firewall_cmd.stdout
        | default('', true)
        | regex_findall('(?m)^source=(.*)$')
        | first
        | default('unavailable', true)
        | trim
      }}
    linux_vitals_firewall_detail: >-
      {{
        linux_vitals_firewall_cmd.stdout
        | default('', true)
        | regex_findall('(?m)^detail=(.*)$')
        | first
        | default('', true)
        | trim
      }}
    linux_vitals_firewall_reason: >-
      {%- if linux_vitals_firewall_cmd.rc | default(1) | int != 0 -%}
      the firewall probe exited {{ linux_vitals_firewall_cmd.rc | default('unknown') }}:
      {{ (linux_vitals_firewall_cmd.stderr | default('', true)
          or linux_vitals_firewall_cmd.msg | default('no output', true)) | trim | truncate(200) }}
      {%- endif -%}
  tags:
    - discovery
    - security
