---
- name: Explain unsupported Ansible check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: >-
      linux_vitals.vitals_scan cannot produce a trustworthy report in Ansible
      check mode because its read-only discovery commands are skipped. Run the
      scan without --check; vitals_heal remains opt-in and is disabled by default.
  tags:
    - always

- name: Collect host discovery and extended system details
  ansible.builtin.include_tasks:
    file: discovery.yml
    apply:
      tags:
        - discovery
  tags:
    - discovery
    - kernel
    - security
    - boot

- name: Build host health result
  ansible.builtin.include_tasks:
    file: result.yml
    apply:
      tags:
        - result
  tags:
    - result
    - reporting
