---
# Everything the scan collects and derives, in the order it runs. main.yml
# includes this file once, with `apply: tags: [discovery]`; every other tag
# is on the tasks themselves.
#
# The files are brought in with import_tasks, so their tasks are inlined here
# when this file loads, exactly as if they were still written in it: same
# order, same tags, same conditions, and no extra task in the run. An import
# passes any tags or `when` it carries on to every task in its file, which is
# why none of these carry any. reboot_facts.yml and services.yml are included
# dynamically, as they were before the split (#27).
#
# The order is load-bearing: facts, then probes, then derived facts, each
# reading only facts set above it. docs/architecture.md ("vitals_scan task
# layout") lists what reads what.

# 1. Facts everything after this reads.
- name: Gather platform and service facts
  ansible.builtin.import_tasks: facts.yml

# 2. Probes: read-only commands. Each registers raw output and derives
#    nothing, and none reads another's result.
- name: Probe the journal for recent errors
  ansible.builtin.import_tasks: log_errors.yml

- name: Probe login records for failed logins and the last boot
  ansible.builtin.import_tasks: login_records.yml

- name: Probe the latest installed kernel
  ansible.builtin.import_tasks: kernel.yml

- name: Probe the bootloader default entry
  ansible.builtin.import_tasks: bootloader.yml

- name: Probe the distro reboot-required checks
  ansible.builtin.import_tasks: reboot_probes.yml

- name: Probe SELinux and AppArmor
  ansible.builtin.import_tasks: security.yml

- name: Probe /boot for rescue images
  ansible.builtin.import_tasks: rescue_image.yml

- name: Probe the journal for kernel install failures
  ansible.builtin.import_tasks: kernel_install_failures.yml

- name: Probe CPU load, pressure stalls and swap activity
  ansible.builtin.import_tasks: pressure.yml

# 3. Derived facts. Each reads facts set above it, never ones it sets itself.
- name: Evaluate the journal probes
  ansible.builtin.import_tasks: journal_facts.yml

- name: Evaluate memory usage
  ansible.builtin.import_tasks: memory.yml

- name: Evaluate CPU load, pressure stalls and swap activity
  ansible.builtin.import_tasks: pressure_facts.yml

- name: Parse the probes into discovery facts
  ansible.builtin.import_tasks: extended_facts.yml

- name: Derive reboot requirement facts
  ansible.builtin.include_tasks: reboot_facts.yml
  tags:
    - discovery
    - kernel

- name: Compare the bootloader default with the latest installed kernel
  ansible.builtin.import_tasks: bootloader_facts.yml

- name: Evaluate boot partition space
  ansible.builtin.import_tasks: boot_space.yml

- name: Evaluate filesystem capacity and inodes across every mount
  ansible.builtin.import_tasks: filesystems.yml

- name: Build required service status map
  ansible.builtin.include_tasks: services.yml
  tags:
    - discovery
