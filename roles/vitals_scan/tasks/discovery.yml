---
- name: Refresh platform facts for health evaluation
  ansible.builtin.setup:
    gather_subset:
      - min
      - hardware
      - network
      - virtual
  tags:
    - discovery

- name: Collect service facts
  ansible.builtin.service_facts:
  tags:
    - discovery

- name: Define distro-aware health check context
  ansible.builtin.set_fact:
    linux_vitals_service_names: "{{ ansible_facts.services.keys() | list }}"
    linux_vitals_pkg_manager: >-
      {{ 'apt' if ansible_facts['os_family'] == 'Debian' else
         'zypper' if ansible_facts['os_family'] == 'Suse' else
         'dnf' }}
    linux_vitals_log_source: >-
      {{ 'journald' if ansible_facts['service_mgr'] == 'systemd' else 'system logs' }}
    linux_vitals_time_sync_candidates:
      - chronyd.service
      - chronyd
      - chrony.service
      - chrony
      - ntpd.service
      - ntpd
      - ntp.service
      - ntp
      - systemd-timesyncd.service
      - systemd-timesyncd
  tags:
    - discovery

- name: Resolve time synchronization service
  ansible.builtin.set_fact:
    linux_vitals_time_sync_service: >-
      {{
        (
          linux_vitals_time_sync_candidates
          | select('in', linux_vitals_service_names) | list
          | first
        ) | default('absent', true)
      }}
  tags:
    - discovery

- name: Collect recent systemd log errors
  ansible.builtin.command:
    argv:
      - journalctl
      - --since
      - "{{ linux_vitals_log_window }}"
      - --no-pager
      - --output=short-iso
  register: linux_vitals_journalctl
  changed_when: false
  failed_when: false
  when: ansible_facts['service_mgr'] == "systemd"
  tags:
    - discovery

- name: Collect recent failed login attempts
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "lastb -n 5 2>/dev/null"
  register: linux_vitals_failed_login_attempts_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - security

- name: Collect last reboot information
  ansible.builtin.command:
    argv:
      - who
      - -b
  register: linux_vitals_last_reboot_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - boot

- name: Collect latest installed kernel version
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          # A /lib/modules directory left behind by an interrupted package
          # removal (no modules.dep, no matching image in /boot) is not an
          # installed kernel -- counting it as "latest" produces a permanent
          # false "latest installed kernel is not running" finding, so only
          # directories that still look like a real kernel are considered.
          list_installed_kernels() {
            for module_dir in /lib/modules/*; do
              [ -d "$module_dir" ] || continue
              version="${module_dir##*/}"
              if [ -f "$module_dir/modules.dep" ] ||
                 [ -f "/boot/vmlinuz-$version" ] ||
                 [ -f "/boot/vmlinuz-$version.efi" ] ||
                 [ -f "/boot/kernel-$version" ]; then
                printf '%s\n' "$version"
              fi
            done
          }

          latest="$(list_installed_kernels | sort -V | tail -n 1)"
          filtered=true
          if [ -z "$latest" ]; then
            # Nothing passed the filter (minimal image, container, unusual
            # layout) -- fall back to the unfiltered listing rather than
            # reporting no installed kernel at all.
            latest="$(ls -1 /lib/modules 2>/dev/null | sort -V | tail -n 1)"
            filtered=false
          fi

          updated_at=""
          if [ -n "$latest" ] && [ -d "/lib/modules/$latest" ]; then
            updated_at="$(stat -c '%y' "/lib/modules/$latest" 2>/dev/null || true)"
          fi

          printf 'latest=%s\n' "$latest"
          printf 'updated_at=%s\n' "$updated_at"
          printf 'filtered=%s\n' "$filtered"
  register: linux_vitals_latest_kernel_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - kernel

- name: Collect bootloader default kernel information
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          sanitize_kernel() {
            kernel_value="$1"
            # An entry can point at a symlink (Debian's /vmlinuz) or at a path
            # that is relative to a separate /boot partition -- resolve both
            # before reducing the path to a bare kernel version.
            for candidate in "$kernel_value" "/boot$kernel_value"; do
              if [ -L "$candidate" ]; then
                resolved_link="$(readlink -f "$candidate" 2>/dev/null || true)"
                if [ -n "$resolved_link" ]; then
                  kernel_value="$resolved_link"
                  break
                fi
              fi
            done
            kernel_value="${kernel_value##*/}"
            kernel_value="${kernel_value%.efi}"
            kernel_value="${kernel_value#vmlinuz-}"
            kernel_value="${kernel_value#vmlinux-}"
            kernel_value="${kernel_value#linux-}"
            kernel_value="${kernel_value#kernel-}"
            printf '%s' "$kernel_value"
          }

          bls_entry_dirs="/boot/loader/entries /boot/efi/loader/entries /efi/loader/entries"

          # RHEL 8+/Fedora and SUSE with BLS keep boot entries as drop-in files
          # rather than menuentry blocks, so grub.cfg parsing never sees them.
          resolve_kernel_from_bls_id() {
            entry_id="$1"
            [ -n "$entry_id" ] || return 0
            for entries_dir in $bls_entry_dirs; do
              [ -d "$entries_dir" ] || continue
              for entry_conf in "$entries_dir/$entry_id" "$entries_dir/$entry_id.conf"; do
                if [ -f "$entry_conf" ]; then
                  kernel_from_bls_conf "$entry_conf"
                  return 0
                fi
              done
            done
          }

          resolve_kernel_from_bls_title() {
            entry_title="$1"
            [ -n "$entry_title" ] || return 0
            for entries_dir in $bls_entry_dirs; do
              [ -d "$entries_dir" ] || continue
              for entry_conf in "$entries_dir"/*.conf; do
                [ -f "$entry_conf" ] || continue
                conf_title="$(awk '$1 == "title" { $1 = ""; sub(/^[ \t]+/, ""); print; exit }' "$entry_conf")"
                if [ "$conf_title" = "$entry_title" ]; then
                  kernel_from_bls_conf "$entry_conf"
                  return 0
                fi
              done
            done
          }

          # Type 1 entries carry a `linux` line; unified kernel image (type 2)
          # entries carry an `efi` line pointing at the bundled image instead.
          kernel_from_bls_conf() {
            entry_conf="$1"
            kernel_line="$(awk '$1 == "linux" { print $2; exit }' "$entry_conf")"
            if [ -z "$kernel_line" ]; then
              kernel_line="$(awk '$1 == "efi" { print $2; exit }' "$entry_conf")"
            fi
            printf '%s' "$kernel_line"
          }

          resolve_kernel_from_any_entry() {
            entry_reference="$1"
            resolved_from_entry="$(resolve_kernel_from_bls_id "$entry_reference")"
            if [ -z "$resolved_from_entry" ]; then
              resolved_from_entry="$(resolve_kernel_from_bls_title "$entry_reference")"
            fi
            if [ -z "$resolved_from_entry" ] && [ -n "$grub_cfg" ]; then
              resolved_from_entry="$(resolve_kernel_from_grubcfg "$entry_reference" "$grub_cfg")"
            fi
            printf '%s' "$resolved_from_entry"
          }

          # Portable POSIX sh state machine (no gawk-only 3-arg match()) so this
          # works under mawk/dash/BusyBox targets, not just gawk-equipped hosts.
          resolve_kernel_from_grubcfg() {
            entry_name="$1"
            config_path="$2"
            [ -n "$entry_name" ] || return 0
            [ -f "$config_path" ] || return 0
            in_entry=0
            while IFS= read -r line; do
              case "$line" in
                menuentry\ *)
                  in_entry=0
                  rest="${line#menuentry }"
                  case "$rest" in
                    \'*)
                      title="${rest#\'}"
                      title="${title%%\'*}"
                      ;;
                    \"*)
                      title="${rest#\"}"
                      title="${title%%\"*}"
                      ;;
                    *)
                      title=""
                      ;;
                  esac
                  if [ "$title" = "$entry_name" ]; then
                    in_entry=1
                  fi
                  ;;
                *)
                  if [ "$in_entry" -eq 1 ]; then
                    set -f
                    set -- $line
                    set +f
                    if [ "$1" = "linux" ] || [ "$1" = "linuxefi" ] || [ "$1" = "linux16" ]; then
                      printf '%s\n' "$2"
                      return 0
                    fi
                  fi
                  ;;
              esac
            done < "$config_path"
          }

          resolve_kernel_from_grubcfg_by_index() {
            target_index="$1"
            config_path="$2"
            [ -f "$config_path" ] || return 0
            current_index=-1
            in_entry=0
            while IFS= read -r line; do
              case "$line" in
                menuentry\ *)
                  current_index=$((current_index + 1))
                  in_entry=0
                  if [ "$current_index" -eq "$target_index" ]; then
                    in_entry=1
                  fi
                  ;;
                *)
                  if [ "$in_entry" -eq 1 ]; then
                    set -f
                    set -- $line
                    set +f
                    if [ "$1" = "linux" ] || [ "$1" = "linuxefi" ] || [ "$1" = "linux16" ]; then
                      printf '%s\n' "$2"
                      return 0
                    fi
                  fi
                  ;;
              esac
            done < "$config_path"
          }

          print_result() {
            printf 'supported=%s\n' "$1"
            printf 'source=%s\n' "$2"
            printf 'default_entry=%s\n' "$3"
            printf 'default_kernel=%s\n' "$4"
            printf 'status=%s\n' "$5"
          }

          grub_cfg=""
          for candidate in /boot/grub2/grub.cfg /boot/grub/grub.cfg /boot/efi/EFI/*/grub.cfg /efi/EFI/*/grub.cfg; do
            if [ -f "$candidate" ]; then
              grub_cfg="$candidate"
              break
            fi
          done

          if command -v grubby >/dev/null 2>&1; then
            default_kernel_path="$(grubby --default-kernel 2>/dev/null || true)"
            if [ -n "$default_kernel_path" ]; then
              print_result "true" "grubby" "$default_kernel_path" "$(sanitize_kernel "$default_kernel_path")" "resolved"
              exit 0
            fi
          fi

          grub_editenv_cmd=""
          for candidate_cmd in grub2-editenv grub-editenv; do
            if command -v "$candidate_cmd" >/dev/null 2>&1; then
              grub_editenv_cmd="$candidate_cmd"
              break
            fi
          done

          grub_env=""
          for candidate in /boot/grub2/grubenv /boot/grub/grubenv /boot/efi/EFI/*/grubenv /efi/EFI/*/grubenv; do
            if [ -f "$candidate" ]; then
              grub_env="$candidate"
              break
            fi
          done

          if [ -n "$grub_editenv_cmd" ] && [ -n "$grub_env" ]; then
            saved_entry="$("$grub_editenv_cmd" "$grub_env" list 2>/dev/null | sed -n 's/^saved_entry=//p' | head -n 1)"
            if [ -n "$saved_entry" ]; then
              resolved_kernel=""
              resolved_path="$(resolve_kernel_from_any_entry "$saved_entry")"
              if [ -n "$resolved_path" ]; then
                resolved_kernel="$(sanitize_kernel "$resolved_path")"
              else
                case "$saved_entry" in
                  *vmlinuz*|*linux-*)
                    resolved_kernel="$(sanitize_kernel "$saved_entry")"
                    ;;
                esac
              fi
              result_status="entry-only"
              if [ -n "$resolved_kernel" ]; then
                result_status="resolved"
              fi
              print_result "true" "grubenv" "$saved_entry" "$resolved_kernel" "$result_status"
              exit 0
            fi
          fi

          if [ -f /etc/default/grub ]; then
            grub_default_raw="$(sed -n 's/^GRUB_DEFAULT=//p' /etc/default/grub | head -n 1 | tr -d '"' | tr -d "'")"
            if [ -n "$grub_default_raw" ] && [ "$grub_default_raw" != "saved" ]; then
              resolved_kernel=""
              case "$grub_default_raw" in
                ''|*[!0-9]*)
                  resolved_path="$(resolve_kernel_from_any_entry "$grub_default_raw")"
                  if [ -n "$resolved_path" ]; then
                    resolved_kernel="$(sanitize_kernel "$resolved_path")"
                  else
                    case "$grub_default_raw" in
                      *vmlinuz*|*linux-*)
                        resolved_kernel="$(sanitize_kernel "$grub_default_raw")"
                        ;;
                    esac
                  fi
                  ;;
                *)
                  if [ -n "$grub_cfg" ]; then
                    resolved_path="$(resolve_kernel_from_grubcfg_by_index "$grub_default_raw" "$grub_cfg")"
                    if [ -n "$resolved_path" ]; then
                      resolved_kernel="$(sanitize_kernel "$resolved_path")"
                    fi
                  fi
                  ;;
              esac
              result_status="entry-only"
              if [ -n "$resolved_kernel" ]; then
                result_status="resolved"
              fi
              print_result "true" "grub_default" "$grub_default_raw" "$resolved_kernel" "$result_status"
              exit 0
            fi
          fi

          # systemd-boot: no grub anywhere, the default lives in loader.conf and
          # may be a glob (systemd-boot then picks the version-highest match).
          for loader_conf in /boot/loader/loader.conf /boot/efi/loader/loader.conf /efi/loader/loader.conf; do
            [ -f "$loader_conf" ] || continue
            entries_dir="${loader_conf%/loader.conf}/entries"
            default_pattern="$(awk '$1 == "default" { print $2; exit }' "$loader_conf")"
            if [ -z "$default_pattern" ]; then
              print_result "true" "systemd-boot" "" "" "entry-only"
              exit 0
            fi
            matched_entry=""
            if [ -d "$entries_dir" ]; then
              matched_entry="$(
                for entry_conf in "$entries_dir"/$default_pattern "$entries_dir"/$default_pattern.conf; do
                  [ -f "$entry_conf" ] && printf '%s\n' "$entry_conf"
                done | sort -V -u | tail -n 1
              )"
            fi
            resolved_kernel=""
            if [ -n "$matched_entry" ]; then
              resolved_path="$(kernel_from_bls_conf "$matched_entry")"
              if [ -n "$resolved_path" ]; then
                resolved_kernel="$(sanitize_kernel "$resolved_path")"
              fi
            fi
            result_status="entry-only"
            if [ -n "$resolved_kernel" ]; then
              result_status="resolved"
            fi
            print_result "true" "systemd-boot" "$default_pattern" "$resolved_kernel" "$result_status"
            exit 0
          done

          print_result "false" "unavailable" "" "" "unavailable"
  register: linux_vitals_bootloader_default_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - kernel

- name: Check if reboot is required on Debian family
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          # /run is the modern location; /var/run is a compat symlink on
          # systemd hosts but can still be a real directory elsewhere, so both
          # are checked. update-notifier-common (Ubuntu) and unattended-upgrades
          # also drop a .pkgs file naming the packages that asked for a reboot.
          marker=""
          for candidate in /run/reboot-required /var/run/reboot-required; do
            if [ -f "$candidate" ]; then
              marker="$candidate"
              break
            fi
          done

          packages=""
          for candidate in /run/reboot-required.pkgs /var/run/reboot-required.pkgs; do
            if [ -f "$candidate" ] && [ -r "$candidate" ]; then
              packages="$(
                sort -u "$candidate" 2>/dev/null |
                  tr -d '\r' |
                  sed '/^[[:space:]]*$/d' |
                  tr '\n' ',' |
                  sed 's/,$//'
              )"
              break
            fi
          done

          detail=""
          if [ -n "$marker" ] && [ -r "$marker" ]; then
            detail="$(head -n 1 "$marker" 2>/dev/null | tr -d '\r')"
          fi

          printf 'supported=true\n'
          printf 'detected=%s\n' "$([ -n "$marker" ] && printf 'true' || printf 'false')"
          printf 'source=%s\n' "$([ -n "$marker" ] && printf '%s' "$marker" || printf 'reboot-required-file')"
          printf 'detail=%s\n' "$detail"
          printf 'packages=%s\n' "$packages"
  register: linux_vitals_debian_reboot_cmd
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - discovery
    - kernel

- name: Check if reboot is recommended on RedHat family
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          # `needs-restarting -r` exits 0 (no reboot needed) or 1 (reboot
          # needed); anything else means the check itself failed and must not
          # be read as "no reboot needed". The standalone binary ships in
          # dnf-utils/yum-utils; on dnf5 hosts (Fedora 41+) the same check is
          # only reachable as a dnf subcommand.
          probe_output=""
          probe_rc=0
          probe_source=""

          if command -v needs-restarting >/dev/null 2>&1; then
            probe_output="$(needs-restarting -r 2>&1)"
            probe_rc=$?
            probe_source="needs-restarting"
          elif command -v dnf >/dev/null 2>&1 &&
               dnf needs-restarting --help >/dev/null 2>&1; then
            # The --help gate matters: dnf4 without the plugin exits 1 for an
            # unknown command, which is exactly the "reboot needed" code.
            probe_output="$(dnf --quiet needs-restarting --reboothint 2>&1)"
            probe_rc=$?
            probe_source="dnf-needs-restarting"
          fi

          if [ -z "$probe_source" ]; then
            printf 'supported=false\n'
            printf 'detected=false\n'
            printf 'source=needs-restarting-missing\n'
            printf 'detail=needs-restarting is not installed (dnf-utils/yum-utils)\n'
            printf 'packages=\n'
            exit 0
          fi

          detail="$(printf '%s' "$probe_output" | sed '/^[[:space:]]*$/d' | tail -n 1)"

          case "$probe_rc" in
            0)
              printf 'supported=true\n'
              printf 'detected=false\n'
              ;;
            1)
              printf 'supported=true\n'
              printf 'detected=true\n'
              ;;
            *)
              printf 'supported=false\n'
              printf 'detected=false\n'
              detail="$probe_source exited $probe_rc: $detail"
              ;;
          esac
          printf 'source=%s\n' "$probe_source"
          printf 'detail=%s\n' "$detail"
          printf 'packages=\n'
  register: linux_vitals_redhat_reboot_cmd
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - discovery
    - kernel

- name: Check if reboot is recommended on SUSE family
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
          # zypper 1.14.44+ answers this directly: exit 0 means no reboot is
          # needed, 102 (ZYPPER_EXIT_INF_REBOOT_NEEDED) means one is. Older
          # zypper rejects the subcommand, so fall back to the marker files
          # written by the zypper plugin / transactional-update.
          if command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive needs-rebooting >/dev/null 2>&1
            zypper_rc=$?
            case "$zypper_rc" in
              0)
                printf 'supported=true\ndetected=false\nsource=zypper-needs-rebooting\ndetail=\npackages=\n'
                exit 0
                ;;
              102)
                printf 'supported=true\ndetected=true\nsource=zypper-needs-rebooting\n'
                printf 'detail=zypper reports core libraries or the kernel were updated\n'
                printf 'packages=\n'
                exit 0
                ;;
            esac
          fi

          marker=""
          for candidate in /run/reboot-needed /var/run/reboot-needed /run/reboot-required /var/run/reboot-required; do
            if [ -f "$candidate" ]; then
              marker="$candidate"
              break
            fi
          done

          printf 'supported=true\n'
          printf 'detected=%s\n' "$([ -n "$marker" ] && printf 'true' || printf 'false')"
          printf 'source=%s\n' "$([ -n "$marker" ] && printf '%s' "$marker" || printf 'reboot-needed-file')"
          printf 'detail=\n'
          printf 'packages=\n'
  register: linux_vitals_suse_reboot_cmd
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'Suse'
  tags:
    - discovery
    - kernel

- name: Collect SELinux mode
  ansible.builtin.command:
    argv:
      - getenforce
  register: linux_vitals_selinux_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - security

- name: Collect AppArmor status
  ansible.builtin.command:
    argv:
      - aa-status
      - --enabled
  register: linux_vitals_apparmor_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - security

- name: Collect rescue image presence
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - "find /boot -maxdepth 1 \\( -name '*rescue*' -o -name 'initramfs-*rescue*' \\) 2>/dev/null | head -n 5"
  register: linux_vitals_rescue_image_cmd
  changed_when: false
  failed_when: false
  tags:
    - discovery
    - boot

- name: Collect kernel install failures from logs
  ansible.builtin.command:
    argv:
      - journalctl
      - --since
      - "{{ linux_vitals_audit_log_window }}"
      - --no-pager
      - --output=short-iso
  register: linux_vitals_audit_journalctl
  changed_when: false
  failed_when: false
  when: ansible_facts['service_mgr'] == "systemd"
  tags:
    - discovery
    - kernel

- name: Evaluate base memory and log health
  ansible.builtin.set_fact:
    linux_vitals_memory_total_mb: "{{ ansible_facts.memtotal_mb | float }}"
    linux_vitals_memory_available_mb: >-
      {{ ansible_facts.memavailable_mb | default(ansible_facts.memfree_mb, true) | float }}
    linux_vitals_memory_used_mb: >-
      {{
        (ansible_facts.memtotal_mb | float)
        - (ansible_facts.memavailable_mb | default(ansible_facts.memfree_mb, true) | float)
      }}
    linux_vitals_ram_used_pct: >-
      {{
        (
          (
            (
              (ansible_facts.memtotal_mb | float)
              - (ansible_facts.memavailable_mb | default(ansible_facts.memfree_mb, true) | float)
            ) / (ansible_facts.memtotal_mb | float)
          ) * 100
        ) | round(1)
      }}
    linux_vitals_log_matches: >-
      {{
        (
          linux_vitals_journalctl.stdout
          | default('')
          | regex_findall('(?im)^.*(?:error|failed).*$')
        )
      }}
    linux_vitals_kernel_failure_matches: >-
      {{
        (
          linux_vitals_audit_journalctl.stdout
          | default('')
          | regex_findall('(?im)^.*(?:kernel|grub|dracut|initramfs).*(?:fail|error).*$')
        )
      }}
  tags:
    - discovery
    - kernel
    - security
    - boot

- name: Finalize extended discovery facts
  ansible.builtin.set_fact:
    linux_vitals_log_errors: "{{ linux_vitals_log_matches | length }}"
    linux_vitals_log_excerpt: "{{ linux_vitals_log_matches[:5] }}"
    linux_vitals_ram_status: >-
      {{
        'Critical'
        if linux_vitals_ram_used_pct | float
        >= linux_vitals_ram_critical_threshold | float
        else 'Warning'
        if linux_vitals_ram_used_pct | float
        >= linux_vitals_ram_warning_threshold | float
        else 'OK'
      }}
    linux_vitals_virtualization_type: "{{ ansible_facts['virtualization_type'] | default('unknown') }}"
    linux_vitals_platform_type: >-
      {{
        'Virtual Machine'
        if ansible_facts['virtualization_role'] | default('NA') == 'guest'
        else 'Physical'
        if ansible_facts['virtualization_type'] | default('') in ['NA', '', 'none']
        else 'Hypervisor'
      }}
    linux_vitals_uptime_seconds: "{{ ansible_facts['uptime_seconds'] | default(0) | int }}"
    linux_vitals_uptime_readable: >-
      {{
        (
          (ansible_facts['uptime_seconds'] | default(0) | int // 86400) | string
        ) ~ 'd '
        ~ (
          ((ansible_facts['uptime_seconds'] | default(0) | int % 86400) // 3600) | string
        ) ~ 'h '
        ~ (
          (((ansible_facts['uptime_seconds'] | default(0) | int % 3600) // 60)) | string
        ) ~ 'm'
      }}
    linux_vitals_running_kernel: "{{ ansible_facts['kernel'] | default('unknown') }}"
    linux_vitals_latest_installed_kernel: >-
      {{
        linux_vitals_latest_kernel_cmd.stdout
        | default('')
        | regex_findall('(?m)^latest=(.*)$')
        | first
        | default('', true)
        | trim
        | default('unknown', true)
      }}
    linux_vitals_latest_kernel_updated_at: >-
      {{
        linux_vitals_latest_kernel_cmd.stdout
        | default('')
        | regex_findall('(?m)^updated_at=(.*)$')
        | first
        | default('', true)
        | trim
        | default('unknown', true)
      }}
    linux_vitals_latest_kernel_selected: >-
      {{
        (
          linux_vitals_latest_kernel_cmd.stdout
          | default('')
          | regex_findall('(?m)^latest=(.*)$')
          | first
          | default('')
          | trim
        ) == (
          ansible_facts['kernel'] | default('') | trim
        )
      }}
    linux_vitals_bootloader_supported: >-
      {{
        (
          linux_vitals_bootloader_default_cmd.stdout
          | regex_findall('(?m)^supported=(.*)$')
          | first
          | default('false')
          | trim
        ) == 'true'
      }}
    linux_vitals_bootloader_default_source: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^source=(.*)$')
        | first
        | default('unavailable')
        | trim
      }}
    linux_vitals_bootloader_default_entry: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^default_entry=(.*)$')
        | first
        | default('')
        | trim
      }}
    linux_vitals_bootloader_default_kernel: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^default_kernel=(.*)$')
        | first
        | default('')
        | trim
      }}
    linux_vitals_bootloader_default_status: >-
      {{
        linux_vitals_bootloader_default_cmd.stdout
        | regex_findall('(?m)^status=(.*)$')
        | first
        | default('unavailable')
        | trim
      }}
    linux_vitals_reboot_probe_output: >-
      {{
        linux_vitals_debian_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'Debian'
        else linux_vitals_redhat_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'RedHat'
        else linux_vitals_suse_reboot_cmd.stdout | default('')
        if ansible_facts['os_family'] == 'Suse'
        else ''
      }}
    linux_vitals_selinux_status: >-
      {{
        linux_vitals_selinux_cmd.stdout
        | default('', true)
        | trim
        | default('not-installed', true)
      }}
    linux_vitals_apparmor_status: >-
      {{
        'enabled'
        if linux_vitals_apparmor_cmd.rc | default(1) == 0
        else 'disabled'
      }}
    linux_vitals_failed_login_attempts: >-
      {{
        linux_vitals_failed_login_attempts_cmd.stdout_lines
        | default([])
        | reject('equalto', '')
        | reject('match', '^btmp begins ')
        | list
      }}
    linux_vitals_last_failed_login: >-
      {{
        (
          linux_vitals_failed_login_attempts_cmd.stdout_lines
          | default([])
          | reject('equalto', '')
          | reject('match', '^btmp begins ')
          | list
        ) | first | default('No failed login attempts found')
      }}
    linux_vitals_last_reboot: >-
      {{
        linux_vitals_last_reboot_cmd.stdout
        | default('Unknown')
        | regex_replace('^\\s*system boot\\s+', '')
        | trim
      }}
    linux_vitals_kernel_install_failures: "{{ linux_vitals_kernel_failure_matches | length }}"
    linux_vitals_kernel_install_failure_excerpt: "{{ linux_vitals_kernel_failure_matches[:5] }}"
    linux_vitals_rescue_image_available: >-
      {{
        linux_vitals_rescue_image_cmd.stdout | default('') | trim | length > 0
      }}
    linux_vitals_rescue_image_paths: "{{ linux_vitals_rescue_image_cmd.stdout_lines | default([]) }}"
  tags:
    - discovery
    - kernel
    - security
    - boot

- name: Derive reboot requirement facts
  ansible.builtin.include_tasks: reboot_facts.yml
  tags:
    - discovery
    - kernel

- name: Finalize bootloader default-kernel match fact
  ansible.builtin.set_fact:
    linux_vitals_bootloader_default_matches_latest: >-
      {{
        linux_vitals_bootloader_default_status == 'resolved'
        and linux_vitals_bootloader_default_kernel == linux_vitals_latest_installed_kernel
      }}
  tags:
    - discovery
    - kernel

- name: Finalize bootloader validation message
  ansible.builtin.set_fact:
    linux_vitals_bootloader_validation_message: >-
      {{
        'Default boot entry selects the latest installed kernel'
        if linux_vitals_bootloader_default_status == 'resolved'
        and linux_vitals_bootloader_default_matches_latest
        else 'Default boot entry does not select the latest installed kernel'
        if linux_vitals_bootloader_default_status == 'resolved'
        else 'Default boot entry detected but the kernel could not be resolved'
        if linux_vitals_bootloader_default_status == 'entry-only'
        else 'Bootloader default kernel validation is not available on this host'
      }}
  tags:
    - discovery
    - kernel

- name: Build boot partition facts
  ansible.builtin.set_fact:
    linux_vitals_boot_mount: >-
      {{
        (
          (
            ansible_facts['mounts'] | default([])
            | selectattr('mount', 'equalto', '/boot')
            | list
          )
          + (
            ansible_facts['mounts'] | default([])
            | selectattr('mount', 'equalto', '/boot/efi')
            | list
          )
        )
        | first
        | default({}, true)
      }}
  tags:
    - discovery
    - boot

- name: Finalize boot space facts
  ansible.builtin.set_fact:
    linux_vitals_boot_mount_point: "{{ linux_vitals_boot_mount.mount | default('not-mounted') }}"
    linux_vitals_boot_free_mb: >-
      {{
        (linux_vitals_boot_mount.size_available | default(0) | float / 1048576)
        | round(1)
      }}
    linux_vitals_boot_total_mb: >-
      {{
        (linux_vitals_boot_mount.size_total | default(0) | float / 1048576)
        | round(1)
      }}
    linux_vitals_boot_free_pct: >-
      {{
        (
          (
            (
              linux_vitals_boot_mount.size_available | default(0) | float
            ) / (
              linux_vitals_boot_mount.size_total | default(1) | float
            )
          ) * 100
        ) | round(1)
      }}
    linux_vitals_boot_space_status: >-
      {{
        'Not Available'
        if linux_vitals_boot_mount.mount is not defined
        else 'Low'
        if (
          (
            (
              linux_vitals_boot_mount.size_available | default(0) | float
            ) / (
              linux_vitals_boot_mount.size_total | default(1) | float
            ) * 100
          ) | round(1)
        ) < linux_vitals_boot_warning_threshold | float
        else 'Healthy'
      }}
  tags:
    - discovery
    - boot

- name: Build required service status map
  ansible.builtin.include_tasks: services.yml
  tags:
    - discovery
