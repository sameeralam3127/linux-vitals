---
linux_vitals_log_window: "30 minutes ago"
linux_vitals_audit_log_window: "7 days ago"
# Journal scans are filtered and capped on the managed host, so a chatty
# journal cannot grow what crosses to the control node (#23). `log_errors`
# counts entries at this journalctl priority or worse: `err` covers
# err, crit, alert and emerg.
linux_vitals_log_priority: err
# The most journal lines either scan returns per host: the newest entries for
# `log_errors`, the newest matching lines for `kernel_install_failures`. A
# count that reaches it means "at least this many".
linux_vitals_log_max_lines: 2000
linux_vitals_ram_warning_threshold: 80
linux_vitals_ram_critical_threshold: 95
linux_vitals_boot_warning_threshold: 20
# CPU saturation, pressure stalls and swap activity (#34). Load is the
# 5-minute load average divided by the online CPUs: 1.0 means every CPU was
# busy on average, so the warning level sits above it.
linux_vitals_load_warning_threshold: 1.5
linux_vitals_load_critical_threshold: 3.0
# PSI `some avg60`: the percentage of the last minute in which at least one
# task was stalled waiting for CPU, memory or I/O (kernel 4.20 and later).
linux_vitals_psi_warning_threshold: 25
linux_vitals_psi_critical_threshold: 50
# Pages swapped in plus out per second, measured over a short sample.
linux_vitals_swap_rate_warning_threshold: 100
linux_vitals_swap_rate_critical_threshold: 1000
# Seconds between the two /proc/vmstat reads the swap rate comes from. Every
# host waits this long once per scan; 0 skips the rate and its finding.
linux_vitals_swap_sample_seconds: 2

# --------------------------------------------------------------------------
# Finding severity
# --------------------------------------------------------------------------
# Every finding carries a stable `id`, a human `message`, and a `severity` of
# info, warning, or critical. The id is the key into the map below, and it is
# also what the before/after comparison diffs on -- so a finding whose wording
# changes, or whose severity is retuned, is still recognised as the same
# finding across runs.
#
# The ordering that gives these meaning:
#
#   critical  something is broken now, or you are blind to it
#   warning   something will break, or a control you rely on is off
#   info      worth seeing, too noisy to page on
linux_vitals_severity_order:
  - info
  - warning
  - critical

# The shipped classification. Override individual entries with
# linux_vitals_finding_severity_overrides rather than replacing this whole
# map, so that findings added in a later release keep a sensible default.
linux_vitals_finding_severities:
  # Broken now.
  ram_critical: critical
  journald_inactive: critical
  service_manual_followup: critical
  # Will break, or a control is off.
  boot_space_low: warning
  reboot_required: warning
  kernel_not_latest: warning
  bootloader_mismatch: warning
  kernel_install_failures: warning
  sssd_inactive: warning
  time_sync_absent: warning
  time_sync_inactive: warning
  selinux_disabled: warning
  apparmor_disabled: warning
  # Saturation (#34). Each of these carries its own severity, warning or
  # critical by threshold; this entry is what an `unknown` one gets.
  cpu_load_high: warning
  pressure_stall_high: warning
  swap_paging_high: warning
  # Security posture (#36). A host with no active firewall, or sshd
  # accepting empty passwords, is broken now, not just drifting -- critical.
  # A permissive root-login setting or password auth being on is common
  # enough to be intentional, so it is a warning pending #8's classification
  # pass; override per-fleet with linux_vitals_finding_severity_overrides.
  firewall_inactive: critical
  ssh_permit_root_login_insecure: warning
  ssh_password_authentication_enabled: warning
  ssh_permit_empty_passwords_enabled: critical
  kernel_tainted: warning
  reboot_blocking_deleted_libs: warning
  # Worth seeing, too noisy to page on. Both are counts of things that occur
  # on healthy hosts as a matter of course.
  log_errors: info
  failed_logins: info

# Per-finding retuning, merged over the map above. A shop that does not run
# AppArmor, or that treats a pending reboot as routine, changes it here:
#
#   linux_vitals_finding_severity_overrides:
#     apparmor_disabled: info
#     reboot_required: critical
linux_vitals_finding_severity_overrides: {}

# The severity at which a finding makes a host fail.
#
# `info` -- the default -- means any finding fails the host, which is the
# behaviour every release before severity existed had. Raising this to
# `warning` or `critical` is what turns severity into triage: the host still
# reports every finding, but only ones at or above this level count against
# it. Changing it changes final_status, the health score, and the exit-code
# behaviour in #41 once that lands, so it is left at the conservative value.
linux_vitals_fail_on_severity: info
