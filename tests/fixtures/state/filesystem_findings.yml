# Filesystem capacity, inode and read-only checks across every mount (#30).
# Otherwise a healthy Ubuntu host (copied from ubuntu_healthy), so every
# finding below comes from the mounts list, not from anything else on the
# host. /boot itself is the no-size-data case this issue also fixes: it
# must read as filesystem_unavailable, never boot_space_low (the bug), and
# boot_space_status must read as 'Not Available', not 'Low'.
role_vars:
  linux_vitals_disk_expected_readonly_mounts:
    - /mnt/expected-ro
state:
  state_schema: 1
  collected_at: "2026-09-26T14:02:11Z"
  host:
    inventory_hostname: filesystem-findings
    hostname: fs-01
    ip_address: 10.0.3.12
    product_serial: VMware-42 1a 7c 3f
  platform:
    os_family: Debian
    distribution: Ubuntu
    distribution_version: "24.04"
    kernel: 6.8.0-45-generic
    service_mgr: systemd
    uptime_seconds: 184020
    virtualization_type: VMware
    virtualization_role: guest
  memory:
    total_mb: 7938
    available_mb: 5120
    free_mb: 3011
  mounts:
    # /boot: present, but the probe timed out, so no size fields at all --
    # the bug this issue fixes. Must become filesystem_unavailable
    # (status: unknown), never boot_space_low.
    - mount: /boot
      note: "Could not get extra information due to timeout"
    # /: healthy, plenty of room. fstype overlay on purpose -- a container
    # runtime's root is commonly overlay, and overlay is excluded by
    # default like other pseudo-filesystems. / must stay in scope anyway:
    # excluding the one mount every host has because of its fstype would
    # be a bug, caught for real on every distribution Molecule tests on.
    - mount: /
      fstype: overlay
      options: "rw,relatime"
      size_available: 42000000000
      size_total: 53687091200
      inode_available: 3000000
      inode_total: 3276800
    # Individual host files a container runtime bind-mounts into every
    # container. Each reports the host disk's own size/inodes, not a
    # filesystem of its own, and is excluded by default
    # (linux_vitals_disk_exclude_mounts) -- must not appear in filesystems
    # or ever become the worst mount.
    - mount: /etc/hostname
      fstype: ext4
      options: "rw,relatime"
      size_available: 42000000000
      size_total: 53687091200
      inode_available: 3000000
      inode_total: 3276800
    - mount: /etc/hosts
      fstype: ext4
      options: "rw,relatime"
      size_available: 42000000000
      size_total: 53687091200
      inode_available: 3000000
      inode_total: 3276800
    - mount: /etc/resolv.conf
      fstype: ext4
      options: "rw,relatime"
      size_available: 42000000000
      size_total: 53687091200
      inode_available: 3000000
      inode_total: 3276800
    # /var: 97% full and 98% of inodes used -- both findings fire together
    # on the same mount, both critical.
    - mount: /var
      fstype: ext4
      options: "rw,relatime"
      size_available: 322122547
      size_total: 10737418240
      inode_available: 13107
      inode_total: 655360
    # /var/log: 85% full, under the 95% critical line -- warning only.
    - mount: /var/log
      fstype: ext4
      options: "rw,relatime"
      size_available: 322122547
      size_total: 2147483648
      inode_available: 50000
      inode_total: 131072
    # An unexpectedly read-only data mount -- low usage, so only
    # filesystem_read_only fires, proving the checks are independent.
    - mount: /data
      fstype: ext4
      options: "ro,relatime"
      size_available: 90000000000
      size_total: 107374182400
      inode_available: 6000000
      inode_total: 6553600
    # A deliberately read-only mount, named in
    # linux_vitals_disk_expected_readonly_mounts: no finding.
    - mount: /mnt/expected-ro
      fstype: ext4
      options: "ro,relatime"
      size_available: 9000000000
      size_total: 10737418240
      inode_available: 600000
      inode_total: 655360
    # Excluded by fstype default: 99% full but never checked.
    - mount: /snap/core22/1612
      fstype: squashfs
      options: "ro,nodev,relatime"
      size_available: 1048576
      size_total: 107374182
      inode_available: 0
      inode_total: 0
    # tmpfs is not excluded by fstype (unlike overlay, see / above): a
    # tmpfs /run genuinely out of space behaves like a full disk to
    # anything writing to it, so it is checked like any other mount --
    # critically full here (99%), which is the point.
    - mount: /run
      fstype: tmpfs
      options: "rw,nosuid,nodev"
      size_available: 10485760
      size_total: 1073741824
      inode_available: 100
      inode_total: 262144
    # A probe error with no mount name at all: folds into one host-level
    # filesystem_probe_degraded finding, counting both of these.
    - "N/A"
    - "N/A"
  services:
    systemd-journald.service: {state: running, status: static}
    sssd.service: {state: running, status: enabled}
    systemd-timesyncd.service: {state: running, status: enabled}
    ssh.service: {state: running, status: enabled}
