      window: 7 days ago
      stdout: ""
    failed_logins:
      ran: true
      rc: 0
      stdout_lines:
        - ""
        - "btmp begins Tue Sep  1 00:00:02 2026"
    last_reboot:
      ran: true
      rc: 0
      stdout: "         system boot  2026-09-24 10:55"
    installed_kernels:
      ran: true
      rc: 0
      latest: 6.8.0-45-generic
      updated_at: "2026-09-01 04:11:07.000000000 +0000"
      filtered: true
    bootloader:
      ran: true
      rc: 0
      supported: true
      source: grub_default
      default_entry: "0"
      default_kernel: 6.8.0-45-generic
      status: resolved
