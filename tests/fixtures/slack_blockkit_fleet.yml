---
# A synthetic 25-host fleet, used to prove the Slack Block Kit payload stays
# inside Slack's limits and drops the right hosts when it has to.
#
# The single-host fixture (render_templates.yml) cannot exercise any of that:
# the host cap, the worst-first ordering, and the "+ N more" note only appear
# once there are more hosts than linux_vitals_slack_max_hosts. add_host builds
# the fleet in memory, so this needs no containers and runs in the fast pytest
# loop rather than under Molecule.
- name: Build a synthetic fleet
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ lookup('ansible.builtin.env', 'TEST_OUTPUT_DIR') }}"
  tasks:
    - name: Ensure temporary test output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    # 3 critical, 5 warning, 7 info, 10 none. With a cap of 10 the message
    # must show every critical and warning host and none of the "none" ones.
    - name: Create synthetic fleet hosts
      ansible.builtin.add_host:
        name: "synthetic-{{ '%02d' | format(item) }}"
        groups: synthetic_fleet
        host_severity: >-
          {{ 'critical' if item <= 3 else ('warning' if item <= 8 else ('info' if item <= 15 else 'none')) }}
      loop: "{{ range(1, 26) | list }}"
      changed_when: false

- name: Render the Slack Block Kit payload for the synthetic fleet
  hosts: synthetic_fleet
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ lookup('ansible.builtin.env', 'TEST_OUTPUT_DIR') }}"
    linux_vitals_reporting_hosts: "{{ ansible_play_hosts }}"
    linux_vitals_slack_message_header: "Fleet Maintenance Summary"
    linux_vitals_slack_message_footer: "Generated by Ansible"
    linux_vitals_slack_include_host_breakdown: true
    linux_vitals_slack_max_hosts: 10
    linux_vitals_notification_message: "{{ lookup('ansible.builtin.template', '../../roles/vitals_report/templates/slack_message.txt.j2') }}"
    linux_vitals_summary:
      servers_checked: 25
      auto_fixed_count: 2
      critical_error_count: 3
      health_score_pct: 88.0
      health_score_band: "Fair"
      hosts_by_severity: {none: 10, info: 7, warning: 5, critical: 3}
      findings_by_severity: {info: 7, warning: 5, critical: 3}
      fail_on_severity: "critical"
      comparison_active: false
      regressed_count: 0
      improved_count: 0
      new_hosts_count: 0
      snippet: "25 Servers Checked, 2 Auto-Fixed, 3 Critical Errors"
  tasks:
    - name: Populate a per-host health result
      ansible.builtin.set_fact:
        linux_vitals_result:
          hostname: "{{ inventory_hostname }}"
          # An ampersand and angle brackets, so the test can prove Slack
          # mrkdwn escaping happens and that to_json still emits valid JSON.
          ip_address: "10.0.0.{{ inventory_hostname | regex_replace('[^0-9]', '') | int }} <primary & mgmt>"
          platform_type: "Virtual Machine"
          uptime: "3d 4h 5m"
          running_kernel: "6.8.0-generic"
          latest_kernel_selected: "{{ host_severity != 'critical' }}"
          bootloader_default_status: "resolved"
          bootloader_default_entry: "/boot/vmlinuz-6.8.0-generic"
          bootloader_default_kernel: "6.8.0-generic"
          bootloader_default_matches_latest: true
          reboot_required: "{{ host_severity == 'critical' }}"
          reboot_required_source: "/run/reboot-required"
          boot_space_status: "{{ 'Low' if host_severity == 'critical' else 'Healthy' }}"
          failed_login_count: 0
          final_status: "{{ 'Fail' if host_severity == 'critical' else 'Pass' }}"
          severity: "{{ host_severity }}"
          severity_counts: {info: 0, warning: 0, critical: "{{ 1 if host_severity == 'critical' else 0 }}"}
          findings: >-
            {{
              [{'id': 'boot_space_low', 'message': 'Boot partition is low on space', 'severity': 'critical'}]
              if host_severity == 'critical' else []
            }}
          comparison:
            baseline_available: false

    - name: Render Slack Block Kit payload for the fleet
      ansible.builtin.template:
        src: "../../roles/vitals_report/templates/slack_message.json.j2"
        dest: "{{ output_dir }}/slack_fleet.json"
        mode: "0644"
      delegate_to: localhost
      run_once: true
