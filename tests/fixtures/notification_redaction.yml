---
# Drives roles/vitals_report/tasks/notify.yml at an endpoint that cannot answer
# (port 9 is the discard port, closed on CI runners), so every channel fails and
# we can assert on what the failure prints. One channel is enabled per run via
# -e lv_test_channel=slack|webhook|email.
- name: Prove a failed notification never prints its credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lv_test_channel: slack
    lv_test_secret: "S3CRET-TOKEN-MUST-NOT-APPEAR"
    # Distinct from the password on purpose: the mail module already marks
    # password as no_log, and Ansible scrubs that exact value everywhere it
    # appears -- reusing it would mask the username and hide a real leak.
    lv_test_user_secret: "S3CRET-SMTP-USER-MUST-NOT-APPEAR"
    lv_dead_endpoint: "http://127.0.0.1:9"
    linux_vitals_phase: "adhoc"
    linux_vitals_maintenance_id: ""
    linux_vitals_report_title: "LinuxVitals Redaction Fixture"
    linux_vitals_slack_message_header: "Standard Maintenance Summary"
    linux_vitals_slack_message_footer: "Generated by Ansible"
    linux_vitals_slack_include_host_breakdown: true
    linux_vitals_output_path: "/dev/null"
    linux_vitals_json_output_path: ""
    linux_vitals_summary:
      servers_checked: 1
      auto_fixed_count: 0
      critical_error_count: 0
      health_score_pct: 100.0
      health_score_band: "Excellent"
      comparison_active: false
      regressed_count: 0
      improved_count: 0
      new_hosts_count: 0
      snippet: "1 Servers Checked, 0 Auto-Fixed, 0 Critical Errors"
  tasks:
    - name: Seed the per-host result the notification templates read
      ansible.builtin.set_fact:
        linux_vitals_result:
          hostname: "localhost"
          ip_address: "127.0.0.1"
          os: "Ubuntu 24.04"
          os_family: "Debian"
          package_manager: "apt"
          log_source: "journald"
          platform_type: "Virtual Machine"
          virtualization_type: "docker"
          uptime: "1d 2h 3m"
          last_reboot: "2026-04-20 12:00"
          running_kernel: "6.8.0-test"
          latest_installed_kernel: "6.8.0-test"
          latest_kernel_updated_at: "2026-04-20 11:30"
          latest_kernel_selected: true
          bootloader_supported: true
          bootloader_default_source: "grubby"
          bootloader_default_entry: "/boot/vmlinuz-6.8.0-test"
          bootloader_default_kernel: "6.8.0-test"
          bootloader_default_status: "resolved"
          bootloader_default_matches_latest: true
          bootloader_validation_message: "Default boot entry selects the latest installed kernel"
          reboot_required: false
          reboot_detection_supported: true
          reboot_required_source: "reboot-required-file"
          reboot_required_packages: []
          reboot_reason: "No reboot required (reboot-required-file)"
          selinux_status: "not-installed"
          apparmor_status: "enabled"
          boot_mount: "/boot"
          boot_free_mb: 512.0
          boot_total_mb: 1024.0
          boot_free_pct: 50.0
          boot_space_status: "Healthy"
          rescue_image_available: true
          rescue_image_paths: []
          last_failed_login: "No failed login attempts found"
          failed_login_count: 0
          kernel_install_failures: 0
          kernel_install_failure_excerpt: []
          ram_status: "OK"
          ram_used_pct: 43.2
          ram_used_mb: 3456.0
          ram_total_mb: 8192.0
          log_errors: 0
          log_excerpt: []
          asset_serial: "TEST-SERIAL-0001"
          services_healed: []
          healing_results: []
          final_status: "Pass"
          findings: []
          comparison:
            baseline_available: false

    - name: Send notifications at an endpoint that cannot answer
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: notify.yml
      vars:
        linux_vitals_effective_slack_webhook_url: >-
          {{ (lv_dead_endpoint ~ '/services/' ~ lv_test_secret)
             if lv_test_channel == 'slack' else '' }}
        linux_vitals_generic_webhook_enabled: "{{ lv_test_channel == 'webhook' }}"
        linux_vitals_effective_generic_webhook_url: >-
          {{ (lv_dead_endpoint ~ '/hook/' ~ lv_test_secret)
             if lv_test_channel == 'webhook' else '' }}
        linux_vitals_generic_webhook_headers:
          Authorization: "Bearer {{ lv_test_secret }}"
        linux_vitals_generic_webhook_status_code: 200
        linux_vitals_email_enabled: "{{ lv_test_channel == 'email' }}"
        linux_vitals_email_to: ["ops@example.com"]
        linux_vitals_effective_email_host: "127.0.0.1"
        linux_vitals_email_port: 9
        linux_vitals_effective_email_username: "{{ lv_test_user_secret }}"
        linux_vitals_effective_email_password: "{{ lv_test_secret }}"
