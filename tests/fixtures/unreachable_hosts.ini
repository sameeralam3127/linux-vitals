[linux_servers]
reported ansible_connection=local
failed_midscan ansible_connection=local
no_result ansible_connection=local
unreachable ansible_connection=ssh ansible_host=127.0.0.1 ansible_port=1

[linux_servers:vars]
ansible_python_interpreter={{ ansible_playbook_python }}
ansible_ssh_common_args=-o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=2
