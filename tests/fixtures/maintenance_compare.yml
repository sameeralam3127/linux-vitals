---
- name: Baseline phase -- persist snapshots for host-a and host-b
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ lookup('ansible.builtin.env', 'TEST_OUTPUT_DIR') }}"
    linux_vitals_phase: "baseline"
    linux_vitals_maintenance_id: "test-window"
    linux_vitals_snapshot_dir: "{{ output_dir }}/snapshots"
  tasks:
    - name: Seed baseline result for host-a (failing, high ram, old kernel)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 91.0
          running_kernel: "5.14.0-old"
          reboot_required: true
          findings: ["RAM usage is critical", "System reboot is required"]
          comparison: {baseline_available: false}

    - name: Snapshot host-a baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: snapshot
      vars:
        inventory_hostname: "host-a"

    - name: Seed baseline result for host-d (structured findings, pre-retune)
      # host-d exercises the post-severity finding shape. `reboot_required` is
      # carried through both runs but at a different severity and with
      # different wording, which is exactly the case a whole-object diff gets
      # wrong -- it would report the finding as both new and resolved.
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 50.0
          running_kernel: "6.8.0-new"
          reboot_required: true
          severity: "warning"
          findings:
            - id: "reboot_required"
              message: "System reboot is required"
              severity: "warning"
            - id: "log_errors"
              message: "Recent logs contain error or failed entries"
              severity: "info"
          comparison: {baseline_available: false}

    - name: Snapshot host-d baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: snapshot
      vars:
        inventory_hostname: "host-d"

    - name: Seed baseline result for host-e (as a 1.x snapshot holds it)
      # host-e is a maintenance window spanning the upgrade: the baseline was
      # taken by 1.x, so its findings are plain strings. Two of them persist
      # into the postcheck and must match their 2.x counterparts (#77).
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 40.0
          running_kernel: "6.8.0-new"
          reboot_required: true
          findings:
            - "System reboot is required"
            - "nginx.service requires manual follow-up"
            - "A finding no release of LinuxVitals ever emitted"
          comparison: {baseline_available: false}

    - name: Snapshot host-e baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: snapshot
      vars:
        inventory_hostname: "host-e"

    - name: Seed baseline result for host-f (one id, two subjects)
      # host-f holds two findings with the same id, told apart only by
      # subject. One service recovers and another fails during the window;
      # an id-only diff reports neither (#77).
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 40.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings:
            - {id: "service_manual_followup", message: "nginx.service requires manual follow-up", severity: "warning", subject: "nginx.service"}
            - {id: "service_manual_followup", message: "redis.service requires manual follow-up", severity: "warning", subject: "redis.service"}
          comparison: {baseline_available: false}

    - name: Snapshot host-f baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: snapshot
      vars:
        inventory_hostname: "host-f"

    - name: Seed baseline result for host-b (passing)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Pass"
          ram_used_pct: 40.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings: []
          comparison: {baseline_available: false}

    - name: Snapshot host-b baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: snapshot
      vars:
        inventory_hostname: "host-b"

- name: Postcheck phase -- compare host-a (improved), host-b (regressed), host-c (new)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ lookup('ansible.builtin.env', 'TEST_OUTPUT_DIR') }}"
    linux_vitals_phase: "postcheck"
    linux_vitals_maintenance_id: "test-window"
    linux_vitals_snapshot_dir: "{{ output_dir }}/snapshots"
  tasks:
    - name: Seed postcheck result for host-a (now passing, rebooted, kernel updated)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Pass"
          ram_used_pct: 55.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings: []

    - name: Compare host-a against its baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-a"

    - name: Capture host-a comparison
      ansible.builtin.set_fact:
        comparison_host_a: "{{ linux_vitals_result.comparison }}"

    - name: Seed postcheck result for host-b (now failing -- regression)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 96.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings:
            - id: "ram_critical"
              message: "RAM usage is critical"
              severity: "critical"

    - name: Compare host-b against its baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-b"

    - name: Capture host-b comparison
      ansible.builtin.set_fact:
        comparison_host_b: "{{ linux_vitals_result.comparison }}"

    - name: Seed postcheck result for host-c (no baseline snapshot exists)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Pass"
          ram_used_pct: 30.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings: []

    - name: Compare host-c against a nonexistent baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-c"

    - name: Capture host-c comparison
      ansible.builtin.set_fact:
        comparison_host_c: "{{ linux_vitals_result.comparison }}"

    - name: Seed postcheck result for host-d (same finding, retuned severity)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 50.0
          running_kernel: "6.8.0-new"
          reboot_required: true
          severity: "critical"
          findings:
            - id: "reboot_required"
              message: "System reboot is required (reworded)"
              severity: "critical"
            - id: "boot_space_low"
              message: "Boot partition free space is low"
              severity: "warning"

    - name: Compare host-d against its baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-d"

    - name: Capture host-d comparison
      ansible.builtin.set_fact:
        comparison_host_d: "{{ linux_vitals_result.comparison }}"

    - name: Seed postcheck result for host-e (2.x shape, two findings persist)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 40.0
          running_kernel: "6.8.0-new"
          reboot_required: true
          findings:
            - {id: "reboot_required", message: "System reboot is required", severity: "warning"}
            - {id: "service_manual_followup", message: "nginx.service requires manual follow-up", severity: "warning", subject: "nginx.service"}

    - name: Compare host-e against its 1.x baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-e"

    - name: Capture host-e comparison
      ansible.builtin.set_fact:
        comparison_host_e: "{{ linux_vitals_result.comparison }}"

    - name: Seed postcheck result for host-f (redis recovered, postgresql failed)
      ansible.builtin.set_fact:
        linux_vitals_result:
          final_status: "Fail"
          ram_used_pct: 40.0
          running_kernel: "6.8.0-new"
          reboot_required: false
          findings:
            - {id: "service_manual_followup", message: "nginx.service requires manual follow-up", severity: "warning", subject: "nginx.service"}
            - {id: "service_manual_followup", message: "postgresql.service requires manual follow-up", severity: "warning", subject: "postgresql.service"}

    - name: Compare host-f against its baseline
      ansible.builtin.include_role:
        name: sameeralam3127.linux_vitals.vitals_report
        tasks_from: compare
      vars:
        inventory_hostname: "host-f"

    - name: Capture host-f comparison
      ansible.builtin.set_fact:
        comparison_host_f: "{{ linux_vitals_result.comparison }}"

    - name: Write all comparisons to a single JSON file for test assertions
      ansible.builtin.copy:
        dest: "{{ output_dir }}/comparisons.json"
        content: >-
          {{
            {
              'host-a': comparison_host_a,
              'host-b': comparison_host_b,
              'host-c': comparison_host_c,
              'host-d': comparison_host_d,
              'host-e': comparison_host_e,
              'host-f': comparison_host_f
            } | to_nice_json
          }}
        mode: "0644"
