---
# Collections for CI's ansible-core floor jobs: the newest majors that still
# declare support for the floor in ansible-core-floor.txt. Newer majors do
# not -- community.general 12 and community.docker 5 require ansible-core
# >= 2.17, community.general 13 requires >= 2.18 -- so testing the floor with
# them would test a combination nobody on 2.16 can rely on (#86).
#
# requirements.yml and molecule/collections.yml remain the install path for
# everything else.
collections:
  - name: community.general
    version: ">=9.0.0,<12.0.0"
  - name: community.docker
    version: ">=3.10.0,<5.0.0"
