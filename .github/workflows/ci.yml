name: CI

# Pull requests only. A push to a branch with no pull request runs nothing,
# and a merge to main does not re-run what its pull request already ran: the
# weekly workflow (weekly.yml) re-tests main as a whole instead. Every push to
# a branch with an open pull request -- a contributor's fork included -- runs
# this again, and cancels the run it supersedes.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Least privilege: nothing here writes to the repository. Actions are pinned
# to commit SHAs (a tag can be moved; a SHA cannot) and kept current by
# Dependabot -- see .github/dependabot.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two ansible-core targets (#47). `latest` is requirements-dev.txt as written.
# `floor` is the minimum declared in meta/runtime.yml, on the oldest Python
# the README supports -- both 2.16 failures that reached users (#45, #49)
# passed a CI that only ever ran the newest core. See docs/testing.md.
#
# Molecule is not here. It runs weekly, before every release, and on a pull
# request labelled `run-molecule` -- see molecule.yml.
jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint and test (latest ansible-core)
            tooling: latest
            python-version: "3.12"
          - name: lint and test (ansible-core 2.16)
            tooling: floor
            python-version: "3.10"
    env:
      ANSIBLE_LOCAL_TEMP: .ansible/tmp
      ANSIBLE_REMOTE_TEMP: .ansible/tmp
      ANSIBLE_HOME: .ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation tooling
        env:
          TOOLING: ${{ matrix.tooling }}
        run: |
          ./.github/scripts/install-tooling.sh "$TOOLING"
          ./.github/scripts/install-collections.sh "$TOOLING"

      - name: Symlink repository as the sameeralam3127.linux_vitals collection
        run: |
          mkdir -p .dev-collections/ansible_collections/sameeralam3127
          ln -sfn "$GITHUB_WORKSPACE" .dev-collections/ansible_collections/sameeralam3127/linux_vitals

      - name: Run playbook syntax check
        run: ansible-playbook playbooks/healthcheck.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint roles/ playbooks/ molecule/ demo/

      - name: Run pytest
        # One worker per CPU. `loadfile` keeps each test file on one worker,
        # so a module's fixtures still run once.
        run: pytest -q -n auto --dist loadfile

  # The one check branch protection requires. A job that `needs` a failed job
  # is skipped, and branch protection counts a skipped check as passing -- so
  # this runs `always()` and fails itself unless every leg above succeeded.
  validate:
    name: validate
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both ansible-core legs to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::lint and test finished as '$RESULT'; both ansible-core legs must pass."
            exit 1
          fi
          echo "Both ansible-core legs passed."
