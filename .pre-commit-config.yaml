repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.1.1
    hooks:
      - id: ansible-lint
        files: \.(yml|yaml)$
        additional_dependencies:
          - ansible-core>=2.16

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # demo/ ships three shell entry points. shellcheck caught a real bug in them
  # (a `local` reading a variable assigned in the same statement), so it earns
  # its place here rather than relying on anyone remembering to run it.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
